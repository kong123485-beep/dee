とができない。",ko:"그러므로 악인이 심판을 견디지 못하며 죄인이 의인의 회중에 들지 못하리로다"},{n:6,zh:"因為耶和華知道義人的道路；惡人的道路卻必滅亡。",en:"For the LORD knoweth the way of the righteous: but the way of the ungodly shall perish.",ja:"主は正しい者の道を知られる。しかし悪しき者の道は滅びる。",ko:"대저 의인의 길은 여호와께서 인정하시나 악인의 길은 망하리로다"}],Om=[{n:1,zh:"耶和華是我的牧者，我必不致缺乏。",en:"The LORD is my shepherd; I shall not want.",ja:"主はわたしの牧者であって、わたしには乏しいことがない。",ko:"여호와는 나의 목자시니 내가 부족함이 없으리로다"},{n:2,zh:"他使我躺臥在青草地上，領我在可安歇的水邊。",en:"He maketh me to lie down in green pastures: he leadeth me beside the still waters.",ja:"主はわたしを緑の牧場に伏させ、いこいのみぎわに伴われる。",ko:"그가 나를 푸른 초장에 누이시며 쉴 만한 물가으로 인도하시는도다"},{n:3,zh:"他使我的靈魂甦醒，為自己的名引導我走義路。",en:"He restoreth my soul: he leadeth me in the paths of righteousness for his name's sake.",ja:"主はわたしの魂をいきかえらせ、み名のためにわたしを正しい道に導かれる。",ko:"내 영혼을 소생시키시고 자기 이름을 위하여 의의 길로 인도하시는도다"},{n:4,zh:"我雖然行過死蔭的幽谷，也不怕遭害，因為你與我同在；你的杖，你的竿，都安慰我。",en:"Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me.",ja:"たといわたしは死の陰の谷を歩むとも、わざわいを恐れない。あなたがわたしと共におられるからである。",ko:"내가 사망의 음침한 골짜기로 다닐지라도 해를 두려워하지 않을 것은 주께서 나와 함께 하심이라"},{n:5,zh:"在我敵人面前，你為我擺設筵席；你用油膏了我的頭，使我的福杯滿溢。",en:"Thou preparest a table before me in the presence of mine enemies: thou anointest my head with oil; my cup runneth over.",ja:"あなたはわたしの敵の前で、わたしの前に宴を設け、わたしのこうべに油をそそがれる。わたしの杯はあふれる。",ko:"주께서 내 원수의 목전에서 내게 상을 베푸시고 기름으로 내 머리에 바르셨으니 내 잔이 넘치나이다"},{n:6,zh:"我一生一世必有恩惠慈愛隨著我；我且要住在耶和華的殿中，直到永遠。",en:"Surely goodness and mercy shall follow me all the days of my life: and I will dwell in the house of the LORD for ever.",ja:"わたしの生きているかぎりは必ず恵みと慈しみとが伴うであろう。わたしはとこしえに主の宮に住むであろう。",ko:"나의 평생에 선하심과 인자하심이 정녕 나를 따르리니 내가 여호와의 집에 영원히 거하리로다"}],Fm=[{n:1,zh:"以色列王大衛兒子所羅門的箴言：",en:"The proverbs of Solomon the son of David, king of Israel;",ja:"ダビデの子、イスラエルの王ソロモンの箴言。",ko:"다윗의 아들 이스라엘 왕 솔로몬의 잠언이라"},{n:2,zh:"要使人曉得智慧和訓誨，分辨通達的言語，",en:"To know wisdom and instruction; to perceive the words of understanding;",ja:"これは知恵と教訓とを知り、悟りの言葉を理解し、",ko:"이는 지혜와 훈계를 알게 하며 명철의 말씀을 깨닫게 하며"},{n:3,zh:"使人處事領受智慧、仁義、公平、正直的訓誨，",en:"To receive the instruction of wisdom, justice, and judgment, and equity;",ja:"正しいこと、公平、公正にかなった知恵の教訓を得させるためである。",ko:"지혜롭게, 의롭게, 공평하게, 정직하게 행할 일에 대하여 훈계를 받게 하며"},{n:4,zh:"使愚人靈明，使少年人有知識和謀略，",en:"To give subtilty to the simple, to the young man knowledge and discretion.",ja:"愚かな者に悟りを、若い者に知識と慎みを得させるためである。",ko:"어리석은 자로 슬기롭게 하며 젊은 자에게 지식과 근신함을 주기 위한 것이니"},{n:5,zh:"使智慧人聽見，增長學問，使聰明人得著智謀，",en:"A wise man will hear, and will increase learning; and a man of understanding shall attain unto wise counsels:",ja:"知恵ある者は聞いて学を増し、賢い者は指導を得る。",ko:"지혜 있는 자는 듣고 학식이 더할 것이요 명철한 자는 모략을 얻을 것이라"},{n:6,zh:"使人明白箴言和譬喻，懂得智慧人的言詞和謎語。",en:"To understand a proverb, and the interpretation; the words of the wise, and their dark sayings.",ja:"箴言とたとえ、知恵ある者の言葉と謎とを理解するためである。",ko:"잠언과 비유와 지혜 있는 자의 말과 그 오묘한 말을 깨달으리라"},{n:7,zh:"敬畏耶和華是知識的開端；愚妄人藐視智慧和訓誨。",en:"The fear of the LORD is the beginning of knowledge: but fools despise wisdom and instruction.",ja:"主を恐れることは知識のはじめである。愚か者は知恵と教訓を侮る。",ko:"여호와를 경외하는 것이 지식의 근본이어늘 미련한 자는 지혜와 훈계를 멸시하느니라"},{n:8,zh:"我兒，要聽你父親的訓誨，不可離棄你母親的法則；",en:"My son, hear the instruction of thy father, and forsake not the law of thy mother:",ja:"わが子よ、父の教訓を聞き、母の教えを捨ててはならない。",ko:"내 아들아 네 아비의 훈계를 들으며 네 어미의 법을 떠나지 말라"},{n:9,zh:"因為這要作你頭上的華冠，你項上的金鍊。",en:"For they shall be an ornament of grace unto thy head, and chains about thy neck.",ja:"それらはあなたの頭の麗しい花輪、首の飾りである。",ko:"이는 네 머리의 아름다운 관이요 네 목의 금사슬이니라"},{n:10,zh:"我兒，惡人若引誘你，你不可隨從。",en:"My son, if sinners entice thee, consent thou not.",ja:"わが子よ、罪びとが誘っても、従ってはならない。",ko:"내 아들아 악한 자가 너를 꾈지라도 좇지 말라"},{n:11,zh:"他們若說：你與我們同去，我們要埋伏流人之血，要蹲伏害無罪之人；",en:"If they say, Come with us, let us lay wait for blood, let us lurk privily for the innocent without cause:",ja:"彼らがもし「共に来い、血を流すために待ち伏せしよう」と言っても、",ko:"그들이 만일 말하기를 우리와 함께 가자 우리가 가만히 엎드려 피를 흘리자"},{n:12,zh:"我們好像陰間，把他們活活吞下；他們如同下坑的人，被我們囫圇吞了；",en:"Let us swallow them up alive as the grave; and whole, as those that go down into the pit:",ja:"陰府のように彼らを生きたまま呑み込み、穴に下る者のように全く呑み込もうと言うとも、",ko:"음부가 산 자를 삼킴 같이 그들을 산 채로 삼키자"},{n:13,zh:"我們必得各樣寶物，將所擄來的，裝滿房屋；",en:"We shall find all precious substance, we shall fill our houses with spoil:",ja:"われらはもろもろの尊い宝を得、奪った物で家を満たそうと言うとも、",ko:"우리가 온갖 보화를 얻으며 빼앗은 것으로 우리 집에 채우리니"},{n:14,zh:"你與我們大家同分，我們共用一個囊袋；",en:"Cast in thy lot among us; let us all have one purse:",ja:"くじをわれらと共に引き、共に一つの財布を持とうと言うとも、",ko:"너는 우리와 함께 제비를 뽑고 우리가 함께 전대 하나만 두자 할지라도"},{n:15,zh:"我兒，不要與他們同行一道，禁止你腳走他們的路。",en:"My son, walk not thou in the way with them; refrain thy foot from their path:",ja:"わが子よ、彼らの道に行ってはならない。彼らの道に足を踏み入れてはならない。",ko:"내 아들아 그들과 함께 길에 다니지 말라 네 발을 그 길에서 금하라"},{n:16,zh:"因為，他們的腳奔跑行惡；他們急速流人的血，",en:"For their feet run to evil, and make haste to shed blood.",ja:"彼らの足は悪に走り、血を流すことに速いからだ。",ko:"대저 그 발은 악으로 달려가며 피를 흘리는 데 빠름이니라"},{n:17,zh:"好像飛鳥，網羅設在眼前仍不躲避。",en:"Surely in vain the net is spread in the sight of any bird.",ja:"むだに網を張るのを鳥が見ていても、その網にかかるように、",ko:"무릇 새가 그물 치는 것을 보면 헛일이겠거니와"},{n:18,zh:"這些人埋伏，是為自流己血；蹲伏，是為自害己命。",en:"And they lay wait for their own blood; they lurk privily for their own lives.",ja:"彼らは自分の血を流すために待ち伏せし、自分の命を狙って潜むのだ。",ko:"그들의 가만히 엎드림은 자기의 피를 흘릴 뿐이요 숨어 기다림은 자기의 생명을 해할 뿐이니"},{n:19,zh:"凡貪戀財利的，所行之路都是如此；這貪戀之心乃奪去得財者之命。",en:"So are the ways of every one that is greedy of gain; which taketh away the life of the owners thereof.",ja:"利をむさぼる者の道は皆このようだ。その利が持ち主の命を奪うのだ。",ko:"무릇 이익을 탐하는 자의 길은 다 이러하여 자기의 생명을 잃게 하느니라"},{n:20,zh:"智慧在街市上呼喊，在寬闊處發聲，",en:"Wisdom crieth without; she uttereth her voice in the streets:",ja:"知恵は大路で呼ばわり、広場で声をあげる。",ko:"지혜가 길거리에서 부르며 광장에서 소리를 높이며"},{n:21,zh:"在熱鬧街頭喊叫，在城門口，在城中發出言語，",en:"She crieth in the chief place of concourse, in the openings of the gates: in the city she uttereth her words, saying,",ja:"騒がしい町かどで叫び、城門の入口で語る。",ko:"훤화하는 길머리에서 소리를 지르며 성문 어귀와 성중에서 그 소리를 발하여 가로되"},{n:22,zh:"說：你們愚昧人喜愛愚昧，褻慢人喜歡褻慢，愚頑人恨惡知識，要到幾時呢？",en:"How long, ye simple ones, will ye love simplicity? and the scorners delight in their scorning, and fools hate knowledge?",ja:"思慮に欠ける者よ、いつまで思慮に欠けることを愛し、愚か者はいつまで知識を憎むのか。",ko:"어리석은 자들아 너희가 어리석음을 좋아하며 거만한 자들아 너희가 거만을 기뻐하며 미련한 자들아 너희가 지식을 미워하니 어느 때까지 하겠느냐"},{n:23,zh:"你們當因我的責備回轉；我要將我的靈澆灌你們，將我的話指示你們。",en:"Turn you at my reproof: behold, I will pour out my spirit unto you, I will make known my words unto you.",ja:"わたしの戒めに心を向けよ。見よ、わたしは霊をあなたがたに注ぎ、言葉を知らせよう。",ko:"나의 책망을 듣고 돌이키라 보라 내가 나의 신을 너희에게 부어주며 내 말을 너희에게 보이리라"},{n:24,zh:"我呼喚，你們不肯聽從；我伸手，無人理會；",en:"Because I have called, and ye refused; I have stretched out my hand, and no man regarded;",ja:"わたしが呼んだのにあなたがたは拒み、手を伸べたのに顧みる者がなかった。",ko:"내가 불렀으나 너희가 듣기 싫어하였고 내가 손을 폈으나 돌아보는 자가 없었고"},{n:25,zh:"反輕棄我一切的勸戒，不肯受我的責備。",en:"But ye have set at nought all my counsel, and would none of my reproof:",ja:"あなたがたはわたしの勧めをことごとく捨て、戒めを受け入れなかった。",ko:"도리어 나의 모든 교훈을 멸시하며 나의 책망을 받지 아니하였은즉"},{n:26,zh:"你們遭災難，我就發笑；驚恐臨到你們，我必嗤笑。",en:"I also will laugh at your calamity; I will mock when your fear cometh;",ja:"それゆえあなたがたが災いに遭うとき、わたしは笑い、恐れが臨むときあざ笑う。",ko:"너희가 재앙을 만날 때에 내가 웃을 것이며 너희에게 두려움이 임할 때에 내가 비웃으리라"},{n:27,zh:"驚恐臨到你們，好像狂風；災難來到，如同暴風；急難痛苦臨到你們身上。",en:"When your fear cometh as desolation, and your destruction cometh as a whirlwind; when distress and anguish cometh upon you.",ja:"嵐のように恐れがあなたがたに臨み、つむじ風のように災いが来るとき、",ko:"너희의 두려움이 광풍 같이 임하겠고 너희의 재앙이 폭풍 같이 이르겠고"},{n:28,zh:"那時，你們必呼求我，我卻不答應，懇切地尋找我，卻尋不見。",en:"Then shall they call upon me, but I will not answer; they shall seek me early, but they shall not find me:",ja:"そのとき彼らはわたしを呼んでも答えず、しきりに求めても見いださない。",ko:"그 때에 너희가 나를 부르리라 그래도 내가 대답지 아니하겠고"},{n:29,zh:"因為，你們恨惡知識，不喜愛敬畏耶和華，",en:"For that they hated knowledge, and did not choose the fear of the LORD:",ja:"彼らは知識を憎み、主を恐れることを選ばず、",ko:"대저 너희가 지식을 미워하며 여호와 경외하기를 즐거워하지 아니하며"},{n:30,zh:"不聽我的勸戒，藐視我一切的責備，",en:"They would none of my counsel: they despised all my reproof.",ja:"わたしの勧めに従わず、戒めをことごとく侮ったからだ。",ko:"나의 교훈을 받지 아니하고 나의 모든 책망을 업신여겼음이라"},{n:31,zh:"所以必吃自結的果子，充滿自設的計謀。",en:"Therefore shall they eat of the fruit of their own way, and be filled with their own devices.",ja:"それゆえ彼らは自分の行いの実を食い、はかりごとの報いに飽きる。",ko:"그러므로 자기 행위의 열매를 먹으며 자기 꾀에 배부르리라"},{n:32,zh:"愚昧人背道，必殺己身；愚頑人安逸，必害己命。",en:"For the turning away of the simple shall slay them, and the prosperity of fools shall destroy them.",ja:"思慮に欠ける者の背信は彼らを殺し、愚か者の安逸は彼らを滅ぼす。",ko:"어리석은 자의 퇴보는 자기를 죽이며 미련한 자의 안일은 자기를 멸망시키려니와"},{n:33,zh:"惟有聽從我的，必安然居住，得享安靜，不怕災禍。",en:"But whoso hearkeneth unto me shall dwell safely, and shall be quiet from fear of evil.",ja:"しかしわたしに聞き従う者は安らかに住み、災いを恐れることなく安らかである。",ko:"오직 나를 듣는 자는 안연히 살며 재앙의 두려움이 없이 평안하리라"}],Um={"psalm-1":Mm,"psalm-23":Om,"proverb-1":Fm,"psalm-2":[{n:1,zh:"外邦為什麼爭鬧？萬民為什麼謀算虛妄的事呢？",en:"Why do the heathen rage, and the people imagine a vain thing?",ja:"なぜ、もろもろの国びとは騒ぎ立ち、もろもろの民はむなしいことを企てるのか。",ko:"어찌하여 열방이 분노하며 민족들이 허사를 경영하는고"},{n:2,zh:"世上的君王一齊起來，臣宰一同商議，要敵擋耶和華並他的受膏者，",en:"The kings of the earth set themselves, and the rulers take counsel together, against the LORD, and against his anointed, saying,",ja:"地の王たちは立ち構え、もろもろの君は共にはかり、主とその油そそがれた者とに逆らって言う、",ko:"세상의 군왕들이 나서며 관원들이 서로 꾀하여 여호와와 그 기름 받은 자를 대적하며"},{n:3,zh:"說：我們要掙開他們的捆綁，脫去他們的繩索。",en:"Let us break their bands asunder, and cast away their cords from us.",ja:"「われらは彼らのかせをこわし、彼らの綱を解き捨てよう」と。",ko:"우리가 그 맨 것을 끊고 그 결박을 벗어 버리자 하는도다"},{n:4,zh:"那坐在天上的必發笑；主必嗤笑他們。",en:"He that sitteth in the heavens shall laugh: the Lord shall have them in derision.",ja:"天に座する者は笑い、主は彼らをあざ笑われる。",ko:"하늘에 계신 자가 웃으심이여 주께서 저희를 비웃으시리로다"},{n:5,zh:"那時，他要在怒中責備他們，在烈怒中驚嚇他們，",en:"Then shall he speak unto them in his wrath, and vex them in his sore displeasure.",ja:"その時主は怒りをもって彼らに語り、憤りをもって彼らを恐れさせて言われる、",ko:"그 때에 분을 발하며 진노하사 저희를 놀래어 이르시기를"},{n:6,zh:"說：我已經立我的君在錫安─我的聖山上了。",en:"Yet have I set my king upon my holy hill of Zion.",ja:"「わたしはわが王を聖なる山シオンに立てた」と。",ko:"내가 나의 왕을 내 거룩한 산 시온에 세웠다 하시리로다"},{n:7,zh:"受膏者說：我要傳聖旨。耶和華曾對我說：你是我的兒子，我今日生你。",en:"I will declare the decree: the LORD hath said unto me, Thou art my Son; this day have I begotten thee.",ja:"わたしは主の定めを語ろう。主はわたしに言われた、「あなたはわたしの子、きょう、わたしはあなたを生んだ。",ko:"내가 영을 전하노라 여호와께서 내게 이르시되 너는 내 아들이라 오늘날 내가 너를 낳았도다"},{n:8,zh:"你求我，我就將列國賜你為基業，將地極賜你為田產。",en:"Ask of me, and I shall give thee the heathen for thine inheritance, and the uttermost parts of the earth for thy possession.",ja:"わたしに求めよ、わたしは国々をあなたに嗣業として与え、地のはてまでもあなたの所有としよう。",ko:"내게 구하라 내가 열방을 유업으로 주리니 네 소유가 땅 끝까지 이르리로다"},{n:9,zh:"你必用鐵杖打破他們；你必將他們如同窰匠的瓦器摔碎。",en:"Thou shalt break them with a rod of iron; thou shalt dash them in pieces like a potter's vessel.",ja:"あなたは鉄の杖をもって彼らを打ち砕き、陶器師の器物のように彼らを打ち砕くであろう。",ko:"네가 철장으로 저희를 깨뜨림이여 질그릇 같이 부수리라 하시도다"},{n:10,zh:"現在，你們君王應當省悟！你們世上的審判官該受管教！",en:"Be wise now therefore, O ye kings: be instructed, ye judges of the earth.",ja:"それゆえ、王たちよ、賢くあれ、地を治める者よ、戒めを受けよ。",ko:"그런즉 군왕들아 너희는 지혜를 얻으며 세상의 관원들아 교훈을 받을지어다"},{n:11,zh:"當存畏懼事奉耶和華，又當存戰兢而快樂。",en:"Serve the LORD with fear, and rejoice with trembling.",ja:"恐れをもって主に仕え、おののきをもって喜べ。",ko:"여호와를 경외함으로 섬기고 떨며 즐거워할지어다"},{n:12,zh:"當以嘴親子，恐怕他發怒，你們便在道中滅亡，因為他的怒氣快要發作。凡投靠他的，都是有福的。",en:"Kiss the Son, lest he be angry, and ye perish from the way, when his wrath is kindled but a little. Blessed are all they that put their trust in him.",ja:"子に口づけせよ、主が怒り、あなたがたが道で滅びないために。その怒りはたちまち燃えるからである。すべて主に寄り頼む者はさいわいである。",ko:"그 아들에게 입맞추라 그렇지 아니하면 진노하심으로 너희가 길에서 망하리니 그 진노가 급하심이라 여호와를 의지하는 자는 다 복이 있도다"}],"psalm-91":[{n:1,zh:"住在至高者隱密處的，必住在全能者的蔭下。",en:"He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty.",ja:"いと高き者のもとに住む者は全能者の陰に宿る。",ko:"지존자의 은밀한 곳에 거하는 자는 전능하신 자의 그늘 아래 거하리로다"},{n:2,zh:"我要論到耶和華說：他是我的避難所，是我的山寨，是我的神，是我所倚靠的。",en:"I will say of the LORD, He is my refuge and my fortress: my God; in him will I trust.",ja:"わたしは主に言う、あなたはわが避け所、わが城、わが信頼する神であると。",ko:"내가 여호와를 가리켜 말하기를 저는 나의 피난처요 나의 요새라"},{n:3,zh:"他必救你脫離捕鳥人的網羅和毒害的瘟疫。",en:"Surely he shall deliver thee from the snare of the fowler, and from the noisome pestilence.",ja:"主はあなたを狩人のわなと恐ろしい疫病から救われるからである。",ko:"그가 너를 새 사냥꾼의 올무에서와 극한 염병에서 건지실 것임이로다"},{n:4,zh:"他必用自己的翎毛遮蔽你；你要投靠在他的翅膀底下；他的誠實是大小的盾牌。",en:"He shall cover thee with his feathers, and under his wings shalt thou trust: his truth shall be thy shield and buckler.",ja:"主はその羽をもってあなたをおおい、その翼の下に避け所を与えられる。その真実は盾また砦である。",ko:"그가 깃으로 너를 덮으시리니 네가 그 날개 아래 피하리로다 그 진실함은 방패와 손 방패가 되나니"},{n:5,zh:"你必不怕黑夜的驚駭，或是白日飛的箭，",en:"Thou shalt not be afraid for the terror by night; nor for the arrow that flieth by day;",ja:"あなたは夜の恐ろしい物をも昼飛ぶ矢をも恐れることはない。",ko:"너는 밤에 놀램과 낮에 흐르는 화살과"},{n:6,zh:"也不怕黑夜行的瘟疫，或是午間滅人的毒病。",en:"Nor for the pestilence that walketh in darkness; nor for the destruction that wasteth at noonday.",ja:"暗やみに歩む疫病をも、真昼に荒す滅びをも恐れることはない。",ko:"어두운 밤에 퍼지는 전염병과 밝은 낮에 황폐케 하는 중독을 두려워 아니하리로다"},{n:7,zh:"雖有千人仆倒在你旁邊，萬人仆倒在你右邊，這災卻不得臨近你。",en:"A thousand shall fall at thy side, and ten thousand at thy right hand; but it shall not come nigh thee.",ja:"千人はあなたのかたわらに、万人はあなたの右に倒れても、その災はあなたに近づくことはない。",ko:"천인이 네 곁에서 만인이 네 우편에서 엎드러지나 이 재앙이 네게 가까이 못하리로다"},{n:8,zh:"你惟親眼觀看，見惡人遭報。",en:"Only with thine eyes shalt thou behold and see the reward of the wicked.",ja:"ただ、あなたは目をもって見、悪しき者の報いを見るだけである。",ko:"오직 너는 목도하리니 악인의 보응이 네게 보이리로다"},{n:9,zh:"耶和華是我的避難所；你已將至高者當你的居所，",en:"Because thou hast made the LORD, which is my refuge, even the most High, thy habitation;",ja:"あなたは主を避け所とし、いと高き者をすまいとしたので、",ko:"네가 말하기를 여호와는 나의 피난처시라 하고 지존자로 거처를 삼았으므로"},{n:10,zh:"禍患必不臨到你，災害也不挨近你的帳棚。",en:"There shall no evil befall thee, neither shall any plague come nigh thy dwelling.",ja:"災はあなたに臨まず、悩みはあなたの天幕に近づくことはない。",ko:"화가 네게 미치지 못하며 재앙이 네 장막에 가까이 오지 못하리니"},{n:11,zh:"因他要為你吩咐他的使者，在你行的一切道路上保護你。",en:"For he shall give his angels charge over thee, to keep thee in all thy ways.",ja:"主はあなたのために天使たちに命じて、あなたの歩むすべての道であなたを守らせられる。",ko:"저가 너를 위하여 그 사자들을 명하사 네 모든 길에 너를 지키게 하심이라"},{n:12,zh:"他們要用手托著你，免得你的腳碰在石頭上。",en:"They shall bear thee up in their hands, lest thou dash thy foot against a stone.",ja:"彼らはその手であなたをささえ、あなたの足が石に打ち当ることのないようにする。",ko:"저희가 그 손으로 너를 붙들어 발이 돌에 부딪히지 않게 하리로다"},{n:13,zh:"你要踹在獅子和虺蛇的身上，踐踏少壯獅子和大蛇。",en:"Thou shalt tread upon the lion and adder: the young lion and the dragon shalt thou trample under feet.",ja:"あなたはししと、まむしとを踏み、若いししと、へびとを足の下に踏みにじるであろう。",ko:"네가 사자와 독사를 밟으며 젊은 사자와 뱀을 발로 누르리로다"},{n:14,zh:"神說：因為他專心愛我，我就要搭救他；因為他知道我的名，我要把他安置在高處。",en:"Because he hath set his love upon me, therefore will I deliver him: I will set him on high, because he hath known my name.",ja:"彼はわたしを愛して離れないゆえに、わたしは彼を助けよう。彼はわが名を知るゆえに、わたしは彼を高くしよう。",ko:"저가 나를 사랑한즉 내가 저를 건지리라 저가 내 이름을 안즉 내가 저를 높이리라"},{n:15,zh:"他若求告我，我就應允他；他在急難中，我要與他同在；我要搭救他，使他尊貴。",en:"He shall call upon me, and I will answer him: I will be with him in trouble; I will deliver him, and honour him.",ja:"彼がわたしを呼ぶとき、わたしは彼に答え、悩みのとき、わたしは彼と共にいて、彼を救い、彼に栄えを与えよう。",ko:"저가 내게 간구하리니 내가 응답하리라 저희 환난 때에 내가 저와 함께 하여 건지고 영화롭게 하리라"},{n:16,zh:"我要使他足享長壽，將我的救恩顯明給他。",en:"With long life will I satisfy him, and shew him my salvation.",ja:"わたしは長いいのちをもって彼を満ち足らせ、わが救を彼に示そう。",ko:"내가 장수함으로 저를 만족케 하며 나의 구원을 저에게 보이리라"}],"psalm-121":[{n:1,zh:"我要向山舉目；我的幫助從何而來？",en:"I will lift up mine eyes unto the hills, from whence cometh my help.",ja:"わたしは山にむかって目をあげる。わが助けはどこから来るか。",ko:"내가 산을 향하여 눈을 들리라 나의 도움이 어디서 올꼬"},{n:2,zh:"我的幫助從造天地的耶和華而來。",en:"My help cometh from the LORD, which made heaven and earth.",ja:"わが助けは天と地を造られた主から来る。",ko:"나의 도움은 천지를 지으신 여호와에게서로다"},{n:3,zh:"他必不叫你的腳搖動；保護你的必不打盹！",en:"He will not suffer thy foot to be moved: he that keepeth thee will not slumber.",ja:"主はあなたの足の動くのを許されない。あなたを守る者はまどろむことがない。",ko:"여호와께서 너로 실족지 않게 하시며 너를 지키시는 자가 졸지 아니하시리로다"},{n:4,zh:"保護以色列的，也不打盹也不睡覺。",en:"Behold, he that keepeth Israel shall neither slumber nor sleep.",ja:"見よ、イスラエルを守る者はまどろむこともなく、眠ることもない。",ko:"이스라엘을 지키시는 자는 졸지도 아니하시고 주무시지도 아니하시리로다"},{n:5,zh:"保護你的是耶和華；耶和華在你右邊蔭庇你。",en:"The LORD is thy keeper: the LORD is thy shade upon thy right hand.",ja:"主はあなたを守る者、主はあなたの右の手をおおう陰である。",ko:"여호와는 너를 지키시는 자라 여호와께서 네 우편에서 네 그늘이 되시나니"},{n:6,zh:"白日，太陽必不傷你；夜間，月亮必不害你。",en:"The sun shall not smite thee by day, nor the moon by night.",ja:"昼は太陽があなたを撃つことなく、夜は月があなたを撃つことはない。",ko:"낮의 해가 너를 상치 아니하며 밤의 달도 너를 해치 아니하리로다"},{n:7,zh:"耶和華要保護你，免受一切的災害；他要保護你的性命。",en:"The LORD shall preserve thee from all evil: he shall preserve thy soul.",ja:"主はあなたをすべての災いから守り、あなたの命を守られる。",ko:"여호와께서 너를 지켜 모든 환난을 면케 하시며 또 네 영혼을 지키시리로다"},{n:8,zh:"你出你入，耶和華要保護你，從今時直到永遠。",en:"The LORD shall preserve thy going out and thy coming in from this time forth, and even for evermore.",ja:"主はあなたの出ると入るとを今よりとこしえまでも守られるであろう。",ko:"여호와께서 너의 출입을 지금부터 영원까지 지키시리로다"}]},Xc=["O LORD, how manifold are thy works! in wisdom hast thou made them all: the earth is full of thy riches.","The LORD is nigh unto all them that call upon him, to all that call upon him in truth.","I will praise thee, O LORD, with my whole heart; I will shew forth all thy marvellous works.","The LORD is my rock, and my fortress, and my deliverer; my God, my strength, in whom I will trust.","Bless the LORD, O my soul: and all that is within me, bless his holy name.","The LORD is merciful and gracious, slow to anger, and plenteous in mercy.","As the hart panteth after the water brooks, so panteth my soul after thee, O God.","Create in me a clean heart, O God; and renew a right spirit within me.","O give thanks unto the LORD; for he is good: for his mercy endureth for ever.","The heavens declare the glory of God; and the firmament sheweth his handywork.","Thy word is a lamp unto my feet, and a light unto my path.","I waited patiently for the LORD; and he inclined unto me, and heard my cry.","Commit thy way unto the LORD; trust also in him; and he shall bring it to pass.","Delight thyself also in the LORD; and he shall give thee the desires of thine heart.","The fear of the LORD is clean, enduring for ever: the judgments of the LORD are true and righteous altogether.","Let the words of my mouth, and the meditation of my heart, be acceptable in thy sight, O LORD, my strength, and my redeemer.","The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?","One thing have I desired of the LORD, that will I seek after; that I may dwell in the house of the LORD all the days of my life.","Wait on the LORD: be of good courage, and he shall strengthen thine heart: wait, I say, on the LORD.","The LORD is good, a strong hold in the day of trouble; and he knoweth them that trust in him.","Trust in the LORD with all thine heart; and lean not unto thine own understanding.","In all thy ways acknowledge him, and he shall direct thy paths.","My son, despise not the chastening of the LORD; neither be weary of his correction:","Happy is the man that findeth wisdom, and the man that getteth understanding.","Wisdom is the principal thing; therefore get wisdom: and with all thy getting get understanding.","A soft answer turneth away wrath: but grievous words stir up anger.","The heart of the wise teacheth his mouth, and addeth learning to his lips.","Pride goeth before destruction, and an haughty spirit before a fall."],jc=["耶和華啊，你所造的何其多！都是你用智慧造成的；遍地滿了你的豐富。","凡求告耶和華的，就是誠心求告他的，耶和華便與他們相近。","我要一心稱謝耶和華；我要傳揚你一切奇妙的作為。","耶和華是我的巖石，我的山寨，我的救主，我的神，我的磐石，我所投靠的。","我的心哪，你要稱頌耶和華！凡在我裡面的，也要稱頌他的聖名！","耶和華有憐憫，有恩典，不輕易發怒，且有豐盛的慈愛。","神啊，我的心切慕你，如鹿切慕溪水。","神啊，求你為我造清潔的心，使我裡面重新有正直的靈。","你們要稱謝耶和華，因他本為善；他的慈愛永遠長存！","諸天述說神的榮耀；穹蒼傳揚他的手段。","你的話是我腳前的燈，是我路上的光。","我曾耐性等候耶和華；他垂聽我的呼求。","當將你的事交託耶和華，並倚靠他，他就必成全。","又要以耶和華為樂，他就將你心裡所求的賜給你。","耶和華的道理潔淨，存到永遠；耶和華的典章真實，全然公義。","耶和華─我的磐石，我的救贖主啊，願我口中的言語、心裡的意念在你面前蒙悅納。","耶和華是我的亮光，是我的拯救，我還怕誰呢？","有一件事，我曾求耶和華，我仍要尋求：就是一生一世住在耶和華的殿中。","要等候耶和華！當壯膽，堅固你的心！我再說，要等候耶和華！","耶和華本為善，在患難的日子為人的保障，並且認得那些投靠他的人。","你要專心仰賴耶和華，不可倚靠自己的聰明，","在你一切所行的事上都要認定他，他必指引你的路。","我兒，你不可輕看耶和華的管教，也不可厭煩他的責備；","得智慧，得聰明的，這人便為有福。","智慧為首；所以，要得智慧。在你一切所得之內必得聰明。","回答柔和，使怒消退；言語暴戾，觸動怒氣。","智慧人的心教訓他的口，又使他的嘴增長學問。","驕傲在敗壞以先；狂心在跌倒之前。"],Vm=["主よ、あなたのみわざはいかに多いことか。あなたは知恵をもってすべてを造られた。地はあなたの造られたもので満ちている。","主は主を呼ぶすべての者に近い、真実をもって主を呼ぶすべての者に近い。","わたしは心を尽くして主をほめたたえ、あなたのくすしきみわざを語り伝えよう。","主はわが岩、わが城、わが救い主、わが神、わが避け所なる岩。","わが魂よ、主をほめよ。そのすべての恵みを忘れてはならない。","主はあわれみ深く、恵みに富み、怒ること遅く、慈しみ豊かである。","神よ、鹿が水を求めるように、わが魂はあなたを慕う。","神よ、わたしに清い心を造り、直き霊を新たにしてください。","主に感謝せよ、主は恵み深く、その慈しみはとこしえに絶えることがない。","天は神の栄光を語り、大空はみ手のわざを告げる。","あなたのみ言葉はわが足のともしび、わが道の光です。","わたしは耐え忍んで主を待ち望んだ。主は耳を傾け、わたしの叫びを聞かれた。","あなたの道を主にゆだねよ。主に信頼せよ、主が成し遂げてくださる。","主を喜べ、主はあなたの心の願いをかなえてくださる。","主の戒めは清く、とこしえに変わらない。主のさばきは真実で、ことごとく正しい。","わが岩、わが贖い主なる主よ、わが口の言葉と心の思いとがみ前に喜ばれますように。","主はわたしの光、わたしの救い、わたしは誰を恐れよう。","わたしは一つの
