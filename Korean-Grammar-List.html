da→sasseosseoyo, baeuda→baeweosseosseoyo",cat:"時態"},{id:10,q:"否定：不是、沒有、不知道",a:"아닙니다/아니에요, 없습니다/없어요, 모릅니다/몰라요",roman:"animnida/anieyo, eopseumnida/eopseoyo, moreumnida/mollayo",cat:"時態"},{id:11,q:"안 vs 지 않다",a:"안 A/V 아/어요 = A/V 지 않아요<br>不可用於祈使勸誘<br>친절하다→안 친절해요",roman:"an A/V a/eoyo = A/V ji anhayo<br>chinjeolhada→an chinjeolhaeyo",cat:"時態"},{id:12,q:"못 vs 지 못하다",a:"못 V아/어요 = V지 못해요 表不能、無法<br>요리하다→요리 못해요 (O)",roman:"mot V a/eoyo = V ji motaeyo<br>yorihada→yori motaeyo",cat:"時態"},{id:13,q:"冠形詞 은/ㄴ, 는, 을/ㄹ",a:"形容詞現在 -은/ㄴ：예쁜 가방<br>動詞過去 -은/ㄴ<br>動詞現在 -는：자는 사람<br>動詞未來 -을/ㄹ：먹을 음식",roman:"yeppeun gabang<br>janeun saram<br>meogeul eumsik",cat:"基礎"},{id:14,q:"名詞化 기",a:"A/V + 기 → 名詞化<br>공부하기가 어려워요",roman:"A/V + gi<br>gongbuhagiga eoryeowoyo",cat:"基礎"},{id:15,q:"A→副詞 게",a:"A + 게 → 副詞<br>짧게 잘랐어요<br>例外：많다→많이, 이르다→일찍",roman:"A + ge → busa<br>jjalge jallasseoyo<br>manta→mani, ireuda→iljjik",cat:"基礎"},{id:16,q:"主格 vs 主題",a:"이/가 主格（新資訊）<br>은/는 主題（舊主題、對比）",roman:"i/ga jugyeok · eun/neun juje",cat:"助詞"},{id:17,q:"從…到…",a:"地點：에서~까지<br>時間：부터~까지",roman:"eseo~kkaji · buteo~kkaji",cat:"助詞"},{id:18,q:"和：와/과, (이)랑, 하고",a:"와/과 書面 / (이)랑, 하고 口語",roman:"wa/gwa (seomyeon) / (i)rang, hago (gugeo)",cat:"助詞"},{id:19,q:"에게/한테/께",a:"에게(書面)/한테(口語)給平輩<br>께 給地位高的人<br>받다/배우다 用 에게/한테",roman:"ege/hante/kke<br>batda/baeuda ege/hante",cat:"助詞"},{id:20,q:"N도 省略規則",a:"加於主格後 이/가、은/는省略；受格後 을/를省略",roman:"N-do · i/ga, eun/neun saengnyak · eul/reul saengnyak",cat:"助詞"},{id:21,q:"밖에 vs 만",a:"밖에 + 否定：한 개밖에 못 받았어요<br>만 + 肯定/否定",roman:"bakke + bujeong: han gaebakke mot badasseoyo<br>man",cat:"助詞"},{id:22,q:"(으)로",a:"①方向：오른쪽으로<br>②方法/材料：쌀로<br>交通：걸어서",roman:"oreunjjogeuro · ssallo · georeoseo",cat:"助詞"},{id:23,q:"(이)나",a:"①選擇：물이나 주스<br>②多達：열 개나 먹었어요",roman:"murina juseu · yeol gaena meogeosseoyo",cat:"助詞"},{id:24,q:"N쯤 大約",a:"한 시쯤<br>價錢：N쯤 하다",roman:"han sijjeum · N jjeum hada",cat:"助詞"},{id:25,q:"처럼 / 같이",a:"가수처럼 / 배우같이",roman:"gasucheoreom / baeugachi",cat:"助詞"},{id:26,q:"보다 比較",a:"백화점이 시장보다 더 비싸지요<br>常和 더/덜 合用",roman:"ba
