            padding: 15px;

            width: 100%;

            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background-color: #fff;

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

            position: relative;
            background: #ffffff;
            border-bottom: 1px solid #edf2f7;
            padding-bottom: 20px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }
        .note-item:last-child {
            border-bottom: none;
        }

        /* 左側圓形編號 */
        .note-badge {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            background: #eff6ff;
            color: #3b82f6;
            font-weight: 700;
            font-size: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 1px #dbeafe;
        }

        /* 右側主內容區 */
        .note-content {
            flex-grow: 1;
        }

        .note-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 6px;
        }

        .note-meaning {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
        }

        .note-formula {
            background: #f8fafc;
            color: #3b82f6;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #e2e8f0;
        }

        /* 金句區塊（內嵌精緻小卡） */
        .note-example-box {
            background: #fafafa;
            border-left: 3px solid #3b82f6;
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            margin-top: 8px;
        }

        .kr-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 2px;
        }
        .kr-ex { 
            color: #c2410c; 
            font-weight: bold; 
            font-size: 16px; 
        }
        .speak-btn {
            background-color: #dbeafe;
            border: none;
            color: #1d4ed8;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .speak-btn:hover {
            background-color: #bfdbfe;
        }
        .pinyin-ex { 
            color: #0284c7; 
            font-size: 13px; 
            font-style: italic; 
            margin-bottom: 2px; 
        }
        .zh-ex { 
            color: #64748b; 
            font-size: 14px; 
        }
        
        .counter {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
            width: 100%;
            text-align: right;
        }

</head>

    function speakKorean(text) {
        if (!('speechSynthesis' in window)) {
            alert('您的瀏覽器不支援語音朗讀功能，請使用 Chrome、Edge 或 Safari。');
            return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }

    function updateView() {
        const rowLimit = document.getElementById('rowSelect').value;
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const container = document.getElementById('notesContainer');
        
        let filteredData = rawData.filter(item => {
            return (
                item.n.toString().includes(keyword) ||
                item.m.toLowerCase().includes(keyword) ||
                item.f.toLowerCase().includes(keyword) ||
                item.k.toLowerCase().includes(keyword) ||
                item.p.toLowerCase().includes(keyword) ||
                item.z.toLowerCase().includes(keyword)
            );
        });

        let displayData = filteredData;
        if (rowLimit !== 'all') {
            const limit = parseInt(rowLimit, 10);
            displayData = filteredData.slice(0, limit);
        }

        container.innerHTML = '';
        displayData.forEach(item => {
            const noteItem = document.createElement('div');
            noteItem.className = 'note-item';
            noteItem.innerHTML = `
                <div class="note-badge">${item.n}</div>
                <div class="note-content">
                    <div class="note-header">
                        <span class="note-meaning">${escapeHtml(item.m)}</span>
                        <span class="note-formula">${escapeHtml(item.f)}</span>
                    </div>
                    <div class="note-example-box">
                        <div class="kr-container">
                            <span class="kr-ex">${escapeHtml(item.k)}</span>
                            <button class="speak-btn" onclick="speakKorean('${escapeHtml(item.k)}')">🔊 朗讀</button>
                        </div>
                        <div class="pinyin-ex">💡 讀音：${escapeHtml(item.p)}</div>
                        <div class="zh-ex">${escapeHtml(item.z)}</div>
                    </div>
                </div>
            `;
            container.appendChild(noteItem);
        });

        document.getElementById('rowCountDisplay').innerText = `顯示 ${displayData.length} 筆 (共符合 ${filteredData.length} 筆)`;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    updateView();
</script>
