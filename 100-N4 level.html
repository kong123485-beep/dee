"Nanimo kami no ai kara watashitachi o hanasu koto wa dekimasen.",zh:"因為我深信無論是死，是生，是天使，是掌權的，是有能的，是現在的事，是將來的事，是高處的，是低處的，是別的受造之物，都不能叫我們與神的愛隔絕；這愛是在我們的主基督耶穌裡的。",zh_explain:"～ことはできません N4可能形否定",source:"ローマ 8:38-39"},{id:8,theme:"愛",jp:"神が先に私たちを愛しました。",furigana:"<ruby>神<rt>かみ</rt></ruby>が<ruby>先<rt>さき</rt></ruby>に<ruby>私<rt>わたし</rt></ruby>たちを<ruby>愛<rt>あい</rt></ruby>しました。",romaji:"Kami ga saki ni watashitachi o aimashita.",zh:"我們愛，因為神先愛我們。",zh_explain:"先に＋た形，因果關係 — 和合本",source:"ヨハネの手紙一 4:19"},{id:9,theme:"愛",jp:"愛は多くの罪を覆います。",furigana:"<ruby>愛<rt>あい</rt></ruby>は<ruby>多<rt>おお</rt></ruby>くの<ruby>罪<rt>つみ</rt></ruby>を<ruby>覆<rt>おお</rt></ruby>います。",romaji:"Ai wa ooku no tsumi o ooimasu.",zh:"最要緊的是彼此切實相愛，因為愛能遮掩許多的罪。",zh_explain:"多くの＋名詞，動詞覆う — 和合本 彼前4:8",source:"箴言 10:12 / ペテロ一 4:8"},{id:10,theme:"愛",jp:"愛があるところに、神がいます。",furigana:"<ruby>愛<rt>あい</rt></ruby>があるところに、<ruby>神<rt>かみ</rt></ruby>がいます。",romaji:"Ai ga aru tokoro ni, kami ga imasu.",zh:"從來沒有人見過神，我們若彼此相愛，神就住在我們裡面，愛他的心在我們裡面得以完全了。",zh_explain:"～ところに N4場所句型",source:"ヨハネの手紙一 4:12"},{id:11,theme:"愛",jp:"完全な愛は恐れをなくします。",furigana:"<ruby>完全<rt>かんぜん</rt></ruby>な<ruby>愛<rt>あい</rt></ruby>は<ruby>恐<rt>おそ</rt></ruby>れをなくします。",romaji:"Kanzen na ai wa osore o nakushimasu.",zh:"愛裡沒有懼怕；愛既完全，就把懼怕除去。因為懼怕裡含著刑罰，懼怕的人在愛裡未得完全。",zh_explain:"な形容詞＋は＋をなくす — 和合本",source:"ヨハネの手紙一 4:18"},{id:12,theme:"愛",jp:"言葉だけでなく、行いで愛しましょう。",furigana:"<ruby>言葉<rt>ことば</rt></ruby>だけでなく、<ruby>行<rt>おこな</rt></ruby>いで<ruby>愛<rt>あい</rt></ruby>しましょう。",romaji:"Kotoba dake de naku, okonai de ai shimashou.",zh:"小子們哪，我們相愛，不要只在言語和舌頭上，總要在行為和誠實上。",zh_explain:"だけでなく N4句型",source:"ヨハネの手紙一 3:18"},{id:13,theme:"愛",jp:"神の愛は私たちの心の中にあります。",furigana:"<ruby>神<rt>かみ</rt></ruby>の<ruby>愛<rt>あい</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>たちの<ruby>心<rt>こころ</rt></ruby>の<ruby>中<rt>なか</rt></ruby>にあります。",romaji:"Kami no ai wa watashitachi no kokoro no naka ni arimasu.",zh:"盼望不至於羞恥，因為所賜給我們的聖靈將神的愛澆灌在我們心裡。",zh_explain:"～の中にあります 存在句 — 和合本 羅5:5",source:"ローマ 5:5"},{id:14,theme:"愛",jp:"愛する人は神から生まれました。",furigana:"<ruby>愛<rt>あい</rt></ruby>する<ruby>人<rt>ひと</rt></ruby>は<ruby>神<rt>かみ</rt></ruby>から<ruby>生<rt>う</rt></ruby>まれました。",romaji:"Aisuru hito wa kami kara umaremashita.",zh:"親愛的弟兄啊，我們應當彼此相愛，因為愛是從神來的。凡有愛心的，都是由神而生，並且認識神。",zh_explain:"動詞修飾名詞 愛する人",source:"ヨハネの手紙一 4:7"},{id:15,theme:"希望",jp:"希望を持ち続けなさい。",furigana:"<ruby>希望<rt>きぼう</rt></ruby>を<ruby>持<rt>も</rt></ruby>ち<ruby>続<rt>つづ</rt></ruby>けなさい。",romaji:"Kibou o mochitsuzukenasai.",zh:"也要堅守我們所承認的指望，不至搖動，因為那應許我們的是信實的。",zh_explain:"持ち続ける 複合動詞 N4 — 和合本 來10:23",source:"ヘブライ 10:23"},{id:16,theme:"希望",jp:"主は私の希望です。",furigana:"<ruby>主<rt>しゅ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>の<ruby>希望<rt>きぼう</rt></ruby>です。",romaji:"Shu wa watashi no kibou desu.",zh:"主耶和華啊，你是我所盼望的；從我年幼，你是我所倚靠的。",zh_explain:"AはBです 最基礎文型 — 和合本 詩71:5",source:"詩篇 71:5"},{id:17,theme:"希望",jp:"泣いている人も、喜ぶ日が来ます。",furigana:"<ruby>泣<rt>な</rt></ruby>いている<ruby>人<rt>ひと</rt></ruby>も、<ruby>喜<rt>よろこ</rt></ruby>ぶ<ruby>日<rt>ひ</rt></ruby>が<ruby>来<rt>き</rt></ruby>ます。",romaji:"Naite iru hito mo, yorokobu hi ga kimasu.",zh:"因為，他的怒氣不過是轉眼之間；他的恩典乃是一生之久。夜間雖有哭泣，早晨便必歡呼。",zh_explain:"～ている人＋も，未來希望 — 和合本 詩30:5",source:"詩篇 30:5"},{id:18,theme:"希望",jp:"神は良い計画を持っています。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>良<rt>よ</rt></ruby>い<ruby>計画<rt>けいかく</rt></ruby>を<ruby>持<rt>も</rt></ruby>っています。",romaji:"Kami wa yoi keikaku o motte imasu.",zh:"耶和華說：我知道我向你們所懷的意念是賜平安的意念，不是降災禍的意念，要叫你們末後有指望。",zh_explain:"良い＋名詞＋を持っている — 和合本",source:"エレミヤ 29:11"},{id:19,theme:"希望",jp:"朝ごとに、神の愛は新しいです。",furigana:"<ruby>朝<rt>あさ</rt></ruby>ごとに、<ruby>神<rt>かみ</rt></ruby>の<ruby>愛<rt>あい</rt></ruby>は<ruby>新<rt>あたら</rt></ruby>しいです。",romaji:"Asa goto ni, kami no ai wa atarashii desu.",zh:"每早晨，這都是新的；你的誠實極其廣大！",zh_explain:"～ごとに N4 每逢 — 和合本 哀3:23",source:"哀歌 3:23"},{id:20,theme:"希望",jp:"将来は希望でいっぱいです。",furigana:"<ruby>将来<rt>しょうらい</rt></ruby>は<ruby>希望<rt>きぼう</rt></ruby>でいっぱいです。",romaji:"Shourai wa kibou de ippai desu.",zh:"因為至終必有善報；你的指望也不致斷絕。",zh_explain:"～でいっぱいです — 和合本 箴23:18",source:"箴言 23:18"},{id:21,theme:"希望",jp:"神は涙をぬぐってくれます。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>涙<rt>なみだ</rt></ruby>をぬぐってくれます。",romaji:"Kami wa namida o nugutte kuremasu.",zh:"神要擦去他們一切的眼淚；不再有死亡，也不再有悲哀、哭號、疼痛，因為以前的事都過去了。",zh_explain:"～てくれる 施恩句型 N4 — 和合本 啟21:4",source:"黙示録 21:4"},{id:22,theme:"希望",jp:"夜が明けると、喜びが来ます。",furigana:"<ruby>夜<rt>よる</rt></ruby>が<ruby>明<rt>あ</rt></ruby>けると、<ruby>喜<rt>よろこ</rt></ruby>びが<ruby>来<rt>き</rt></ruby>ます。",romaji:"Yoru ga akeru to, yorokobi ga kimasu.",zh:"因為，他的怒氣不過是轉眼之間；他的恩典乃是一生之久。夜間雖有哭泣，早晨便必歡呼。",zh_explain:"～と、～が来ます 條件句 — 和合本",source:"詩篇 30:5"},{id:23,theme:"希望",jp:"希望は私たちを失望させません。",furigana:"<ruby>希望<rt>きぼう</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>たちを<ruby>失望<rt>しつぼう</rt></ruby>させません。",romaji:"Kibou wa watashitachi o shitsubou sasemasen.",zh:"盼望不至於羞恥，因為所賜給我們的聖靈將神的愛澆灌在我們心裡。",zh_explain:"させません 使役否定 — 和合本 羅5:5",source:"ローマ 5:5"},{id:24,theme:"希望",jp:"神は私の光と救いです。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>の<ruby>光<rt>ひかり</rt></ruby>と<ruby>救<rt>すく</rt></ruby>いです。",romaji:"Kami wa watashi no hikari to sukui desu.",zh:"耶和華是我的亮光，是我的拯救，我還怕誰呢？耶和華是我性命的保障，我還懼誰呢？",zh_explain:"AとBです 並列 — 和合本 詩27:1",source:"詩篇 27:1"},{id:25,theme:"希望",jp:"新しい朝が来ました。",furigana:"<ruby>新<rt>あたら</rt></ruby>しい<ruby>朝<rt>あさ</rt></ruby>が<ruby>来<rt>き</rt></ruby>ました。",romaji:"Atarashii asa ga kimashita.",zh:"這是耶和華所定的日子，我們在其中要高興歡喜！",zh_explain:"た形 過去敘述 — 和合本 詩118:24",source:"詩篇 118:24"},{id:26,theme:"信仰",jp:"信じれば、神の力が見えます。",furigana:"<ruby>信<rt>しん</rt></ruby>じれば、<ruby>神<rt>かみ</rt></ruby>の<ruby>力<rt>ちから</rt></ruby>が<ruby>見<rt>み</rt></ruby>えます。",romaji:"Shinjireba, kami no chikara ga miemasu.",zh:"耶穌說：我不是對你說過，你若信，就必看見神的榮耀嗎？",zh_explain:"～ば 可能＋條件 N4重點 — 和合本 約11:40",source:"ヨハネ 11:40"},{id:27,theme:"信仰",jp:"信仰は小さな種のようです。",furigana:"<ruby>信仰<rt>しんこう</rt></ruby>は<ruby>小<rt>ちい</rt></ruby>さな<ruby>種<rt>たね</rt></ruby>のようです。",romaji:"Shinkou wa chiisana tane no you desu.",zh:"耶穌說：是因你們的信心小。我實在告訴你們，你們若有信心，像一粒芥菜種，就是對這座山說：你從這邊挪到那邊。它也必挪去；並且你們沒有一件不能做的事了。",zh_explain:"～のようです 比喻 N4 — 和合本",source:"マタイ 17:20"},{id:28,theme:"信仰",jp:"求めなさい。そうすれば与えられます。",furigana:"<ruby>求<rt>もと</rt></ruby>めなさい。そうすれば<ruby>与<rt>あた</rt></ruby>えられます。",romaji:"Motomenasai. Sou sureba ataeraremasu.",zh:"你們祈求，就給你們；尋找，就尋見；叩門，就給你們開門。",zh_explain:"～なさい＋そうすれば N4 — 和合本",source:"マタイ 7:7"},{id:29,theme:"信仰",jp:"神にはできないことはありません。",furigana:"<ruby>神<rt>かみ</rt></ruby>にはできないことはありません。",romaji:"Kami ni wa dekinai koto wa arimasen.",zh:"因為，出於神的話，沒有一句不帶能力的。",zh_explain:"～ことはありません — 和合本 路1:37",source:"ルカ 1:37"},{id:30,theme:"信仰",jp:"信じる人は川のように生きます。",furigana:"<ruby>信<rt>しん</rt></ruby>じる<ruby>人<rt>ひと</rt></ruby>は<ruby>川<rt>かわ</rt></ruby>のように<ruby>生<rt>い</rt></ruby>きます。",romaji:"Shinjiru hito wa kawa no you ni ikimasu.",zh:"信我的人就如經上所說：從他腹中要流出活水的江河來。",zh_explain:"ように 生き生きした比喩 — 和合本 約7:38",source:"ヨハネ 7:38"},{id:31,theme:"信仰",jp:"私は道であり、真理であり、命です。",furigana:"<ruby>私<rt>わたし</rt></ruby>は<ruby>道<rt>みち</rt></ruby>であり、<ruby>真理<rt>しんり</rt></ruby>であり、<ruby>命<rt>いのち</rt></ruby>です。",romaji:"Watashi wa michi de ari, shinri de ari, inochi desu.",zh:"耶穌說：我就是道路、真理、生命；若不藉著我，沒有人能到父那裡去。",zh_explain:"であり 書面並列 N4 — 和合本",source:"ヨハネ 14:6"},{id:32,theme:"信仰",jp:"恐れないで、ただ信じなさい。",furigana:"<ruby>恐<rt>おそ</rt></ruby>れないで、ただ<ruby>信<rt>しん</rt></ruby>じなさい。",romaji:"Osorenaide, tada shinjinasai.",zh:"耶穌聽見所說的話，就對管會堂的說：不要怕，只要信！",zh_explain:"～ないで＋命令 — 和合本 可5:36",source:"マルコ 5:36"},{id:33,theme:"信仰",jp:"信仰によって私たちは救われました。",furigana:"<ruby>信仰<rt>しんこう</rt></ruby>によって<ruby>私<rt>わたし</rt></ruby>たちは<ruby>救<rt>すく</rt></ruby>われました。",romaji:"Shinkou ni yotte watashitachi wa sukuwaremashita.",zh:"你們得救是本乎恩，也因著信；這並不是出於自己，乃是神所賜的；",zh_explain:"～によって N4原因手段 — 和合本 弗2:8",source:"エフェソ 2:8"},{id:34,theme:"信仰",jp:"全てのことは信仰でできます。",furigana:"<ruby>全<rt>すべ</rt></ruby>てのことは<ruby>信仰<rt>しんこう</rt></ruby>でできます。",romaji:"Subete no koto wa shinkou de dekimasu.",zh:"耶穌對他說：你若能信，在信的人，凡事都能。",zh_explain:"で  means — 和合本 可9:23",source:"マルコ 9:23"},{id:35,theme:"信仰",jp:"見ないで信じる人は幸いです。",furigana:"<ruby>見<rt>み</rt></ruby>ないで<ruby>信<rt>しん</rt></ruby>じる<ruby>人<rt>ひと</rt></ruby>は<ruby>幸<rt>さいわ</rt></ruby>いです。",romaji:"Minaide shinjiru hito wa saiwai desu.",zh:"耶穌對他說：你因看見了我才信；那沒有看見就信的有福了。",zh_explain:"～ないで 修飾 — 和合本 約20:29",source:"ヨハネ 20:29"},{id:36,theme:"信仰",jp:"主を信じなさい。そうすれば救われます。",furigana:"<ruby>主<rt>しゅ</rt></ruby>を<ruby>信<rt>しん</rt></ruby>じなさい。そうすれば<ruby>救<rt>すく</rt></ruby>われます。",romaji:"Shu o shinjinasai. Sou sureba sukuwaremasu.",zh:"他們說：當信主耶穌，你和你一家都必得救。",zh_explain:"～ば救われる 條件 — 和合本 徒16:31",source:"使徒 16:31"},{id:37,theme:"信仰",jp:"祈りは大きな力があります。",furigana:"<ruby>祈<rt>いの</rt></ruby>りは<ruby>大<rt>おお</rt></ruby>きな<ruby>力<rt>ちから</rt></ruby>があります。",romaji:"Inori wa ookina chikara ga arimasu.",zh:"所以你們要彼此認罪，互相代求，使你們可以得醫治。義人祈禱所發的力量是大有功效的。",zh_explain:"～があります — 和合本 雅5:16",source:"ヤコブ 5:16"},{id:38,theme:"信仰",jp:"神の言葉は私の道の光です。",furigana:"<ruby>神<rt>かみ</rt></ruby>の<ruby>言葉<rt>ことば</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>の<ruby>道<rt>みち</rt></ruby>の<ruby>光<rt>ひかり</rt></ruby>です。",romaji:"Kami no kotoba wa watashi no michi no hikari desu.",zh:"你的話是我腳前的燈，是我路上的光。",zh_explain:"AはBのCです — 和合本 詩119:105",source:"詩篇 119:105"},{id:39,theme:"赦し",jp:"互いに許し合いなさい。",furigana:"<ruby>互<rt>たが</rt></ruby>いに<ruby>許<rt>ゆる</rt></ruby>し<ruby>合<rt>あ</rt></ruby>いなさい。",romaji:"Tagai ni yurushiai nasai.",zh:"倘若這人與那人有嫌隙，總要彼此包容，彼此饒恕；主怎樣饒恕了你們，你們也要怎樣饒恕人。",zh_explain:"許し合う 互相寬恕 — 和合本 西3:13",source:"コロサイ 3:13"},{id:40,theme:"赦し",jp:"神は私の罪を許しました。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>の<ruby>罪<rt>つみ</rt></ruby>を<ruby>許<rt>ゆる</rt></ruby>しました。",romaji:"Kami wa watashi no tsumi o yurushimashita.",zh:"我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。",zh_explain:"を許す 他動詞 — 和合本 約壹1:9",source:"ヨハネの手紙一 1:9"},{id:41,theme:"赦し",jp:"七回ではなく、七十回七回許しなさい。",furigana:"<ruby>七回<rt>ななかい</rt></ruby>ではなく、<ruby>七十回七回<rt>ななじゅっかいななかい</rt></ruby><ruby>許<rt>ゆる</rt></ruby>しなさい。",romaji:"Nanakai de wa naku, nanajuu kai nanakai yurushinasai.",zh:"耶穌說：我對你說，不是到七次，乃是到七十個七次。",zh_explain:"ではなく 對比 — 和合本",source:"マタイ 18:22"},{id:42,theme:"赦し",jp:"あなたも人を許さなければなりません。",furigana:"あなたも<ruby>人<rt>ひと</rt></ruby>を<ruby>許<rt>ゆる</rt></ruby>さなければなりません。",romaji:"Anata mo hito o yurusanakereba narimasen.",zh:"你不應當憐恤你的同伴，像我憐恤你嗎？",zh_explain:"なければなりません 義務 — 和合本 太18:33",source:"マタイ 18:33"},{id:43,theme:"赦し",jp:"神は心から許してくれます。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>心<rt>こころ</rt></ruby>から<ruby>許<rt>ゆる</rt></ruby>してくれます。",romaji:"Kami wa kokoro kara yurushite kuremasu.",zh:"他赦免你的一切罪孽，醫治你的一切疾病。",zh_explain:"～てくれる — 和合本 詩103:3",source:"詩篇 103:3"},{id:44,theme:"赦し",jp:"罪を告白すれば、神は許します。",furigana:"<ruby>罪<rt>つみ</rt></ruby>を<ruby>告白<rt>こくはく</rt></ruby>すれば、<ruby>神<rt>かみ</rt></ruby>は<ruby>許<rt>ゆる</rt></ruby>します。",romaji:"Tsumi o kokuhaku sureba, kami wa yurushimasu.",zh:"我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。",zh_explain:"～ば 條件 — 和合本",source:"ヨハネの手紙一 1:9"},{id:45,theme:"赦し",jp:"愛する人は許すことができます。",furigana:"<ruby>愛<rt>あい</rt></ruby>する<ruby>人<rt>ひと</rt></ruby>は<ruby>許<rt>ゆる</rt></ruby>すことができます。",romaji:"Aisuru hito wa yurusu koto ga dekimasu.",zh:"人有見識就不輕易發怒；寬恕人的過失便是自己的榮耀。",zh_explain:"～ことができます 可能 — 和合本 箴19:11",source:"箴言 19:11"},{id:46,theme:"赦し",jp:"過去の罪はもうありません。",furigana:"<ruby>過去<rt>かこ</rt></ruby>の<ruby>罪<rt>つみ</rt></ruby>はもうありません。",romaji:"Kako no tsumi wa mou arimasen.",zh:"若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。",zh_explain:"もう～ありません 完成 — 和合本 林後5:17",source:"コリントの手紙二 5:17"},{id:47,theme:"赦し",jp:"私たちも許す人になりましょう。",furigana:"<ruby>私<rt>わたし</rt></ruby>たちも<ruby>許<rt>ゆる</rt></ruby>す<ruby>人<rt>ひと</rt></ruby>になりましょう。",romaji:"Watashitachi mo yurusu hito ni narimashou.",zh:"你們不要論斷人，就不被論斷；你們不要定人的罪，就不被定罪；你們要饒恕人，就必蒙饒恕；",zh_explain:"～になりましょう 意志 — 和合本 路6:37",source:"ルカ 6:37"},{id:48,theme:"赦し",jp:"神の恵みは罪より大きいです。",furigana:"<ruby>神<rt>かみ</rt></ruby>の<ruby>恵<rt>めぐ</rt></ruby>みは<ruby>罪<rt>つみ</rt></ruby>より<ruby>大<rt>おお</rt></ruby>きいです。",romaji:"Kami no megumi wa tsumi yori ookii desu.",zh:"律法本是外添的，叫過犯顯多；只是罪在哪裡顯多，恩典就更顯多了。",zh_explain:"～より大きい 比較 — 和合本 羅5:20",source:"ローマ 5:20"},{id:49,theme:"赦し",jp:"白い雪のように罪が清くなりました。",furigana:"<ruby>白<rt>しろ</rt></ruby>い<ruby>雪<rt>ゆき</rt></ruby>のように<ruby>罪<rt>つみ</rt></ruby>が<ruby>清<rt>きよ</rt></ruby>くなりました。",romaji:"Shiroi yuki no you ni tsumi ga kiyoku narimashita.",zh:"耶和華說：你們來，我們彼此辯論。你們的罪雖像硃紅，必變成雪白；雖紅如丹顏，必白如羊毛。",zh_explain:"～のように＋なりました — 和合本 賽1:18",source:"イザヤ 1:18"},{id:50,theme:"平和",jp:"平和を作る人は幸いです。",furigana:"<ruby>平和<rt>へいわ</rt></ruby>を<ruby>作<rt>つく</rt></ruby>る<ruby>人<rt>ひと</rt></ruby>は<ruby>幸<rt>さいわ</rt></ruby>いです。",romaji:"Heiwa o tsukuru hito wa saiwai desu.",zh:"使人和睦的人有福了！因為他們必稱為神的兒子。",zh_explain:"を作る人は～です — 和合本 太5:9",source:"マタイ 5:9"},{id:51,theme:"平和",jp:"神は私に平和をくれます。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>に<ruby>平和<rt>へいわ</rt></ruby>をくれます。",romaji:"Kami wa watashi ni heiwa o kuremasu.",zh:"我留下平安給你們；我將我的平安賜給你們。我所賜的，不像世人所賜的。你們心裡不要憂愁，也不要膽怯。",zh_explain:"～に～をくれます — 和合本 約14:27",source:"ヨハネ 14:27"},{id:52,theme:"平和",jp:"心の中に神の平和があります。",furigana:"<ruby>心<rt>こころ</rt></ruby>の<ruby>中<rt>なか</rt></ruby>に<ruby>神<rt>かみ</rt></ruby>の<ruby>平和<rt>へいわ</rt></ruby>があります。",romaji:"Kokoro no naka ni kami no heiwa ga arimasu.",zh:"神所賜、出人意外的平安必在基督耶穌裡保守你們的心懷意念。",zh_explain:"～の中に～があります — 和合本 腓4:7",source:"ピリピ 4:7"},{id:53,theme:"平和",jp:"主は私の羊飼いです。だから安心です。",furigana:"<ruby>主<rt>しゅ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>の<ruby>羊飼<rt>ひつじか</rt></ruby>いです。だから<ruby>安心<rt>あんしん</rt></ruby>です。",romaji:"Shu wa watashi no hitsujikai desu. Dakara anshin desu.",zh:"耶和華是我的牧者，我必不致缺乏。",zh_explain:"だから 原因結果 — 和合本 詩23:1",source:"詩篇 23:1"},{id:54,theme:"平和",jp:"静かにして、神を知りなさい。",furigana:"<ruby>静<rt>しず</rt></ruby>かにして、<ruby>神<rt>かみ</rt></ruby>を<ruby>知<rt>し</rt></ruby>りなさい。",romaji:"Shizuka ni shite, kami o shirinasai.",zh:"你們要休息，要知道我是神！我必在外邦中被尊崇，在遍地上也被尊崇。",zh_explain:"～にして 命令 — 和合本 詩46:10",source:"詩篇 46:10"},{id:55,theme:"平和",jp:"神は私の心を守ります。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>の<ruby>心<rt>こころ</rt></ruby>を<ruby>守<rt>まも</rt></ruby>ります。",romaji:"Kami wa watashi no kokoro o mamorimasu.",zh:"神所賜、出人意外的平安必在基督耶穌裡保守你們的心懷意念。",zh_explain:"を守る — 和合本 腓4:7",source:"ピリピ 4:7"},{id:56,theme:"平和",jp:"恐れずに、平和に生きましょう。",furigana:"<ruby>恐<rt>おそ</rt></ruby>れずに、<ruby>平和<rt>へいわ</rt></ruby>に<ruby>生<rt>い</rt></ruby>きましょう。",romaji:"Osorezu ni, heiwa ni ikimashou.",zh:"你不要害怕，因為我與你同在；不要驚惶，因為我是你的神。我必堅固你，我必幫助你；我必用我公義的右手扶持你。",zh_explain:"～ずに＋ましょう — 和合本 賽41:10",source:"イザヤ 41:10"},{id:57,theme:"平和",jp:"全てを神に任せなさい。",furigana:"<ruby>全<rt>すべ</rt></ruby>てを<ruby>神<rt>かみ</rt></ruby>に<ruby>任<rt>まか</rt></ruby>せなさい。",romaji:"Subete o kami ni makasenasai.",zh:"你們要將一切的憂慮卸給神，因為他顧念你們。",zh_explain:"～に任せる — 和合本 彼前5:7",source:"ペテロの手紙一 5:7"},{id:58,theme:"平和",jp:"神のそばにいると、安心します。",furigana:"<ruby>神<rt>かみ</rt></ruby>のそばにいると、<ruby>安心<rt>あんしん</rt></ruby>します。",romaji:"Kami no soba ni iru to, anshin shimasu.",zh:"我將耶和華常擺在我面前，因他在我右邊，我便不致搖動。",zh_explain:"～と、～します 條件 — 和合本 詩16:8",source:"詩篇 16:8"},{id:59,theme:"平和",jp:"嵐の中でも、神は平和をくれます。",furigana:"<ruby>嵐<rt>あらし</rt></ruby>の<ruby>中<rt>なか</rt></ruby>でも、<ruby>神<rt>かみ</rt></ruby>は<ruby>平和<rt>へいわ</rt></ruby>をくれます。",romaji:"Arashi no naka demo, kami wa heiwa o kuremasu.",zh:"耶穌醒了，斥責風，向海說：住了吧！靜了吧！風就止住，大大的平靜了。",zh_explain:"～の中でも 逆接 — 和合本 可4:39",source:"マルコ 4:39"},{id:60,theme:"勇気",jp:"強くて、勇気を持ちなさい。",furigana:"<ruby>強<rt>つよ</rt></ruby>くて、<ruby>勇気<rt>ゆうき</rt></ruby>を<ruby>持<rt>も</rt></ruby>ちなさい。",romaji:"Tsuyokute, yuuki o mochinasai.",zh:"我豈沒有吩咐你嗎？你當剛強壯膽！不要懼怕，也不要驚惶；因為你無論往哪裡去，耶和華─你的神必與你同在。",zh_explain:"くて連接＋命令 — 和合本 書1:9",source:"ヨシュア 1:9"},{id:61,theme:"勇気",jp:"恐れないでください。神が一緒です。",furigana:"<ruby>恐<rt>おそ</rt></ruby>れないでください。<ruby>神<rt>かみ</rt></ruby>が<ruby>一緒<rt>いっしょ</rt></ruby>です。",romaji:"Osorenaide kudasai. Kami ga issho desu.",zh:"你不要害怕，因為我與你同在；不要驚惶，因為我是你的神。我必堅固你，我必幫助你；我必用我公義的右手扶持你。",zh_explain:"～ないでください 丁寧な禁止 — 和合本",source:"イザヤ 41:10"},{id:62,theme:"勇気",jp:"主が私の力です。",furigana:"<ruby>主<rt>しゅ</rt></ruby>が<ruby>私<rt>わたし</rt></ruby>の<ruby>力<rt>ちから</rt></ruby>です。",romaji:"Shu ga watashi no chikara desu.",zh:"耶和華是我的力量，是我的盾牌；我心裡倚靠他就得幫助。所以我心中歡樂，我必用詩歌頌讚他。",zh_explain:"が強調 — 和合本 詩28:7",source:"詩篇 28:7"},{id:63,theme:"勇気",jp:"疲れたら、神に来なさい。",furigana:"<ruby>疲<rt>つか</rt></ruby>れたら、<ruby>神<rt>かみ</rt></ruby>に<ruby>来<rt>き</rt></ruby>なさい。",romaji:"Tsukaretara, kami ni kinasai.",zh:"凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息。",zh_explain:"～たら 命令 — 和合本 太11:28",source:"マタイ 11:28"},{id:64,theme:"勇気",jp:"神は私を強くします。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>を<ruby>強<rt>つよ</rt></ruby>くします。",romaji:"Kami wa watashi o tsuyoku shimasu.",zh:"我靠著那加給我力量的，凡事都能做。",zh_explain:"～を～くします 使變強 — 和合本 腓4:13",source:"ピリピ 4:13"},{id:65,theme:"勇気",jp:"私は神によって何でもできます。",furigana:"<ruby>私<rt>わたし</rt></ruby>は<ruby>神<rt>かみ</rt></ruby>によって<ruby>何<rt>なん</rt></ruby>でもできます。",romaji:"Watashi wa kami ni yotte nandemo dekimasu.",zh:"我靠著那加給我力量的，凡事都能做。",zh_explain:"によって＋何でも — 和合本",source:"ピリピ 4:13"},{id:66,theme:"勇気",jp:"光は暗闇の中で輝いています。",furigana:"<ruby>光<rt>ひかり</rt></ruby>は<ruby>暗闇<rt>くらやみ</rt></ruby>の<ruby>中<rt>なか</rt></ruby>で<ruby>輝<rt>かがや</rt></ruby>いています。",romaji:"Hikari wa kurayami no naka de kagayaite imasu.",zh:"光照在黑暗裡，黑暗卻不接受光。",zh_explain:"～の中で～ている 進行中 — 和合本 約1:5",source:"ヨハネ 1:5"},{id:67,theme:"勇気",jp:"神は私の盾です。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>の<ruby>盾<rt>たて</rt></ruby>です。",romaji:"Kami wa watashi no tate desu.",zh:"耶和華是我的巖石，我的山寨，我的救主，我的神，我的磐石，我所投靠的。他是我的盾牌，是拯救我的角，是我的高臺。",zh_explain:"盾 比喩 — 和合本 詩18:2",source:"詩篇 18:2"},{id:68,theme:"勇気",jp:"一歩ずつ、前に進みましょう。",furigana:"<ruby>一歩<rt>いっぽ</rt></ruby>ずつ、<ruby>前<rt>まえ</rt></ruby>に<ruby>進<rt>すす</rt></ruby>みましょう。",romaji:"Ippo zutsu, mae ni susumimashou.",zh:"你的話是我腳前的燈，是我路上的光。",zh_explain:"ずつ＋ましょう — 和合本 詩119:105",source:"詩篇 119:105"},{id:69,theme:"勇気",jp:"神が私の味方です。誰を恐れますか。",furigana:"<ruby>神<rt>かみ</rt></ruby>が<ruby>私<rt>わたし</rt></ruby>の<ruby>味方<rt>みかた</rt></ruby>です。<ruby>誰<rt>だれ</rt></ruby>を<ruby>恐<rt>おそ</rt></ruby>れますか。",romaji:"Kami ga watashi no mikata desu. Dare o osoremasu ka.",zh:"耶和華是我的亮光，是我的拯救，我還怕誰呢？耶和華是我性命的保障，我還懼誰呢？",zh_explain:"誰を～ますか 疑問 — 和合本 詩27:1",source:"詩篇 27:1"},{id:70,theme:"勇気",jp:"今日、勇気を出しなさい。",furigana:"<ruby>今日<rt>きょう</rt></ruby>、<ruby>勇気<rt>ゆうき</rt></ruby>を<ruby>出<rt>だ</rt></ruby>しなさい。",romaji:"Kyou, yuuki o dashinasai.",zh:"當夜，主站在保羅旁邊，說：放心吧！你怎樣在耶路撒冷為我作見證，也必怎樣在羅馬為我作見證。",zh_explain:"を出す 慣用 — 和合本 徒23:11",source:"使徒 23:11"},{id:71,theme:"感謝",jp:"全てのことに感謝しなさい。",furigana:"<ruby>全<rt>すべ</rt></ruby>てのことに<ruby>感謝<rt>かんしゃ</rt></ruby>しなさい。",romaji:"Subete no koto ni kansha shinasai.",zh:"凡事謝恩；因為這是神在基督耶穌裡向你們所定的旨意。",zh_explain:"～に感謝する — 和合本 帖前5:18",source:"テサロニケの手紙一 5:18"},{id:72,theme:"感謝",jp:"神の愛に感謝します。",furigana:"<ruby>神<rt>かみ</rt></ruby>の<ruby>愛<rt>あい</rt></ruby>に<ruby>感謝<rt>かんしゃ</rt></ruby>します。",romaji:"Kami no ai ni kansha shimasu.",zh:"你們要稱謝耶和華，因他本為善；他的慈愛永遠長存。",zh_explain:"～に感謝します 丁寧 — 和合本 詩136:1",source:"詩篇 136:1"},{id:73,theme:"感謝",jp:"今日は神が作った日です。喜びましょう。",furigana:"<ruby>今日<rt>きょう</rt></ruby>は<ruby>神<rt>かみ</rt></ruby>が<ruby>作<rt>つく</rt></ruby>った<ruby>日<rt>ひ</rt></ruby>です。<ruby>喜<rt>よろこ</rt></ruby>びましょう。",romaji:"Kyou wa kami ga tsukutta hi desu. Yorokobimashou.",zh:"這是耶和華所定的日子，我們在其中要高興歡喜！",zh_explain:"～が作った日 過去修飾 — 和合本 詩118:24",source:"詩篇 118:24"},{id:74,theme:"感謝",jp:"小さなことにも感謝しましょう。",furigana:"<ruby>小<rt>ちい</rt></ruby>さなことにも<ruby>感謝<rt>かんしゃ</rt></ruby>しましょう。",romaji:"Chiisana koto ni mo kansha shimashou.",zh:"人在最小的事上忠心，在大事上也忠心；在最小的事上不義，在大事上也不義。",zh_explain:"にも 強調小事 — 和合本 路16:10",source:"ルカ 16:10"},{id:75,theme:"感謝",jp:"神は良いものをたくさんくれます。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>良<rt>よ</rt></ruby>いものをたくさんくれます。",romaji:"Kami wa yoi mono o takusan kuremasu.",zh:"各樣美善的恩賜和各樣全備的賞賜都是從上頭來的，從眾光之父那裡降下來的；在他並沒有改變，也沒有轉動的影兒。",zh_explain:"たくさん＋くれる — 和合本 雅1:17",source:"ヤコブ 1:17"},{id:76,theme:"感謝",jp:"いつも喜んでいなさい。",furigana:"いつも<ruby>喜<rt>よろこ</rt></ruby>んでいなさい。",romaji:"Itsumo yorokonde inasai.",zh:"你們要靠主常常喜樂。我再說，你們要喜樂。",zh_explain:"～ていなさい 持續命令 — 和合本 腓4:4",source:"ピリピ 4:4"},{id:77,theme:"感謝",jp:"神の恵みを数えてみましょう。",furigana:"<ruby>神<rt>かみ</rt></ruby>の<ruby>恵<rt>めぐ</rt></ruby>みを<ruby>数<rt>かぞ</rt></ruby>えてみましょう。",romaji:"Kami no megumi o kazoete mimashou.",zh:"我的心哪，你要稱頌耶和華！不可忘記他的一切恩惠！",zh_explain:"～てみましょう 試試 — 和合本 詩103:2",source:"詩篇 103:2"},{id:78,theme:"感謝",jp:"与える人は幸いです。",furigana:"<ruby>与<rt>あた</rt></ruby>える<ruby>人<rt>ひと</rt></ruby>は<ruby>幸<rt>さいわ</rt></ruby>いです。",romaji:"Ataeru hito wa saiwai desu.",zh:"我凡事給你們作榜樣，叫你們知道應當這樣勞苦，扶助軟弱的人，又當記念主耶穌的話，說：施比受更為有福。",zh_explain:"与える人 — 和合本 徒20:35",source:"使徒 20:35"},{id:79,theme:"感謝",jp:"朝、神に感謝を言いましょう。",furigana:"<ruby>朝<rt>あさ</rt></ruby>、<ruby>神<rt>かみ</rt></ruby>に<ruby>感謝<rt>かんしゃ</rt></ruby>を<ruby>言<rt>い</rt></ruby>いましょう。",romaji:"Asa, kami ni kansha o iimashou.",zh:"要早晨傳揚你的慈愛，每夜傳揚你的信實。",zh_explain:"～に～を言う — 和合本 詩92:2",source:"詩篇 92:2"},{id:80,theme:"感謝",jp:"心から神を賛美します。",furigana:"<ruby>心<rt>こころ</rt></ruby>から<ruby>神<rt>かみ</rt></ruby>を<ruby>賛美<rt>さんび</rt></ruby>します。",romaji:"Kokoro kara kami o sanbi shimasu.",zh:"我的心哪，你要稱頌耶和華！凡在我裡面的，也要稱頌他的聖名！",zh_explain:"～から＋を賛美 — 和合本 詩103:1",source:"詩篇 103:1"},{id:81,theme:"愛",jp:"友のために命を捨てるのが愛です。",furigana:"<ruby>友<rt>とも</rt></ruby>のために<ruby>命<rt>いのち</rt></ruby>を<ruby>捨<rt>す</rt></ruby>てるのが<ruby>愛<rt>あい</rt></ruby>です。",romaji:"Tomo no tame ni inochi o suteru no ga ai desu.",zh:"人為朋友捨命，人的愛心沒有比這個大的。",zh_explain:"～のが～です 解釋 — 和合本 約15:13",source:"ヨハネ 15:13"},{id:82,theme:"希望",jp:"神の国はもうすぐ来ます。",furigana:"<ruby>神<rt>かみ</rt></ruby>の<ruby>国<rt>くに</rt></ruby>はもうすぐ<ruby>来<rt>き</rt></ruby>ます。",romaji:"Kami no kuni wa mou sugu kimasu.",zh:"說：日期滿了，神的國近了。你們當悔改，信福音！",zh_explain:"もうすぐ＋来ます — 和合本 可1:15",source:"マルコ 1:15"},{id:83,theme:"信仰",jp:"二人が一緒に祈れば、神が聞きます。",furigana:"<ruby>二人<rt>ふたり</rt></ruby>が<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>祈<rt>いの</rt></ruby>れば、<ruby>神<rt>かみ</rt></ruby>が<ruby>聞<rt>き</rt></ruby>きます。",romaji:"Futari ga issho ni inoreba, kami ga kikimasu.",zh:"我又告訴你們，若是你們中間有兩個人在地上同心合意的求什麼事，我在天上的父必為他們成全。",zh_explain:"～ば 聽聞 — 和合本 太18:19",source:"マタイ 18:19"},{id:84,theme:"平和",jp:"心配しないで、神に祈りなさい。",furigana:"<ruby>心配<rt>しんぱい</rt></ruby>しないで、<ruby>神<rt>かみ</rt></ruby>に<ruby>祈<rt>いの</rt></ruby>りなさい。",romaji:"Shinpai shinaide, kami ni inorinasai.",zh:"應當一無掛慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。",zh_explain:"～ないで＋祈る — 和合本 腓4:6",source:"ピリピ 4:6"},{id:85,theme:"勇気",jp:"私はあなたを見捨てません。",furigana:"<ruby>私<rt>わたし</rt></ruby>はあなたを<ruby>見捨<rt>みす</rt></ruby>てません。",romaji:"Watashi wa anata o misutemasen.",zh:"你們存心不可貪愛錢財，要以自己所有的為足；因為主曾說：我總不撇下你，也不丟棄你。",zh_explain:"見捨てない N4否定 — 和合本 來13:5",source:"ヘブライ 13:5"},{id:86,theme:"赦し",jp:"私たちも人を赦しましょう。",furigana:"<ruby>私<rt>わたし</rt></ruby>たちも<ruby>人<rt>ひと</rt></ruby>を<ruby>赦<rt>ゆる</rt></ruby>しましょう。",romaji:"Watashitachi mo hito o yurushimashou.",zh:"你們饒恕人的過犯，你們的天父也必饒恕你們的過犯；",zh_explain:"～ましょう 意志 — 和合本 太6:14",source:"マタイ 6:14"},{id:87,theme:"愛",jp:"神は孤独な人に家族をくれます。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>孤独<rt>こどく</rt></ruby>な<ruby>人<rt>ひと</rt></ruby>に<ruby>家族<rt>かぞく</rt></ruby>をくれます。",romaji:"Kami wa kodoku na hito ni kazoku o kuremasu.",zh:"神叫孤獨的有家，使被囚的出來享福；惟有悖逆的住在乾燥之地。",zh_explain:"な人＋に＋をくれる — 和合本 詩68:6",source:"詩篇 68:6"},{id:88,theme:"感謝",jp:"毎日、神に感謝する理由があります。",furigana:"<ruby>毎日<rt>まいにち</rt></ruby>、<ruby>神<rt>かみ</rt></ruby>に<ruby>感謝<rt>かんしゃ</rt></ruby>する<ruby>理由<rt>りゆう</rt></ruby>があります。",romaji:"Mainichi, kami ni kansha suru riyuu ga arimasu.",zh:"當稱謝進入他的門；當讚美進入他的院。當感謝他，稱頌他的名！",zh_explain:"理由があります — 和合本 詩100:4",source:"詩篇 100:4"},{id:89,theme:"希望",jp:"神は私を新しい人にしました。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>を<ruby>新<rt>あたら</rt></ruby>しい<ruby>人<rt>ひと</rt></ruby>にしました。",romaji:"Kami wa watashi o atarashii hito ni shimashita.",zh:"若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。",zh_explain:"～にしました 使役 — 和合本 林後5:17",source:"コリントの手紙二 5:17"},{id:90,theme:"信仰",jp:"小さな信仰でも、山を動かせます。",furigana:"<ruby>小<rt>ちい</rt></ruby>さな<ruby>信仰<rt>しんこう</rt></ruby>でも、<ruby>山<rt>やま</rt></ruby>を<ruby>動<rt>うご</rt></ruby>かせます。",romaji:"Chiisana shinkou demo, yama o ugokasemasu.",zh:"耶穌說：是因你們的信心小。我實在告訴你們，你們若有信心，像一粒芥菜種，就是對這座山說：你從這邊挪到那邊。它也必挪去；並且你們沒有一件不能做的事了。",zh_explain:"～でも 可能 — 和合本 太17:20",source:"マタイ 17:20"},{id:91,theme:"愛",jp:"愛は決して消えません。",furigana:"<ruby>愛<rt>あい</rt></ruby>は<ruby>決<rt>けっ</rt></ruby>して<ruby>消<rt>き</rt></ruby>えません。",romaji:"Ai wa kesshite kiemasen.",zh:"愛是永不止息。先知講道之能終必歸於無有；說方言之能終必停止；知識也終必歸於無有。",zh_explain:"決して～ません 強調否定 — 和合本 林前13:8",source:"コリントの手紙一 13:8"},{id:92,theme:"平和",jp:"神と共に歩けば、平和があります。",furigana:"<ruby>神<rt>かみ</rt></ruby>と<ruby>共<rt>とも</rt></ruby>に<ruby>歩<rt>ある</rt></ruby>けば、<ruby>平和<rt>へいわ</rt></ruby>があります。",romaji:"Kami to tomo ni arukeba, heiwa ga arimasu.",zh:"世人哪，耶和華已指示你何為善。他向你所要的是什麼呢？只要你行公義，好憐憫，存謙卑的心，與你的神同行。",zh_explain:"共に歩けば 條件 — 和合本 彌6:8",source:"ミカ 6:8"},{id:93,theme:"勇気",jp:"神は暗い道でも灯りをくれます。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>暗<rt>くら</rt></ruby>い<ruby>道<rt>みち</rt></ruby>でも<ruby>灯<rt>あか</rt></ruby>りをくれます。",romaji:"Kami wa kurai michi demo akari o kuremasu.",zh:"耶穌又對眾人說：我是世界的光。跟從我的，就不在黑暗裡走，必要得著生命的光。",zh_explain:"でも 逆接 — 和合本 約8:12",source:"ヨハネ 8:12"},{id:94,theme:"赦し",jp:"心を尽くして許しなさい。",furigana:"<ruby>心<rt>こころ</rt></ruby>を<ruby>尽<rt>つ</rt></ruby>くして<ruby>許<rt>ゆる</rt></ruby>しなさい。",romaji:"Kokoro o tsukushite yurushinasai.",zh:"你們各人若不從心裡饒恕你的弟兄，我天父也要這樣待你們了。",zh_explain:"を尽くして 全力 — 和合本 太18:35",source:"マタイ 18:35"},{id:95,theme:"感謝",jp:"神の恵みに毎日驚いています。",furigana:"<ruby>神<rt>かみ</rt></ruby>の<ruby>恵<rt>めぐ</rt></ruby>みに<ruby>毎日<rt>まいにち</rt></ruby><ruby>驚<rt>おどろ</rt></ruby>いています。",romaji:"Kami no megumi ni mainichi odoroite imasu.",zh:"便說：人算什麼，你竟顧念他？世人算什麼，你竟眷顧他？",zh_explain:"～に驚いている — 和合本 詩8:4",source:"詩篇 8:4"},{id:96,theme:"希望",jp:"神は私の涙を覚えています。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>の<ruby>涙<rt>なみだ</rt></ruby>を<ruby>覚<rt>おぼ</rt></ruby>えています。",romaji:"Kami wa watashi no namida o oboete imasu.",zh:"我幾次流離，你都記數；求你把我眼淚裝在你的皮袋裡。這不都記在你冊子上嗎？",zh_explain:"を覚えている — 和合本 詩56:8",source:"詩篇 56:8"},{id:97,theme:"信仰",jp:"神の言葉を聞いて、守る人は幸いです。",furigana:"<ruby>神<rt>かみ</rt></ruby>の<ruby>言葉<rt>ことば</rt></ruby>を<ruby>聞<rt>き</rt></ruby>いて、<ruby>守<rt>まも</rt></ruby>る<ruby>人<rt>ひと</rt></ruby>は<ruby>幸<rt>さいわ</rt></ruby>いです。",romaji:"Kami no kotoba o kiite, mamoru hito wa saiwai desu.",zh:"耶穌說：是，卻還不如聽神之道而遵守的人有福。",zh_explain:"て形連接 — 和合本 路11:28",source:"ルカ 11:28"},{id:98,theme:"平和",jp:"主の平和がいつもあなたと一緒にありますように。",furigana:"<ruby>主<rt>しゅ</rt></ruby>の<ruby>平和<rt>へいわ</rt></ruby>がいつもあなたと<ruby>一緒<rt>いっしょ</rt></ruby>にありますように。",romaji:"Shu no heiwa ga itsumo anata to issho ni arimasu you ni.",zh:"願賜平安的主隨時隨事親自給你們平安！願主常與你們眾人同在！",zh_explain:"～ように 祈願 — 和合本 帖後3:16",source:"テサロニケの手紙二 3:16"},{id:99,theme:"愛",jp:"神は私たちを子供と呼んでくれます。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>たちを<ruby>子供<rt>こども</rt></ruby>と<ruby>呼<rt>よ</rt></ruby>んでくれます。",romaji:"Kami wa watashitachi o kodomo to yonde kuremasu.",zh:"你看父賜給我們是何等的慈愛，使我們得稱為神的兒女；我們也真是他的兒女。世人所以不認識我們，是因未曾認識他。",zh_explain:"と呼んでくれる — 和合本 約壹3:1",source:"ヨハネの手紙一 3:1"},{id:100,theme:"希望",jp:"神は最後に全てを良くします。",furigana:"<ruby>神<rt>かみ</rt></ruby>は<ruby>最後<rt>さいご</rt></ruby>に<ruby>全<rt>すべ</rt></ruby>てを<ruby>良<rt>よ</rt></ruby>くします。",romaji:"Kami wa saigo ni subete o yoku shimasu.",zh:"我們曉得萬事都互相效力，叫愛神的人得益處，就是按他旨意被召的人。",zh_explain:"最後に～を良くする 總結 — 和合本 羅8:28",source:"ローマ 8:28"}];function ro(){let[e,t]=ee.useState(""),[r,n]=ee.useState("全部"),[u,i]=ee.useState(!0),[l,o]=ee.useState(!0),[a,c]=ee.useState(null),[m,y]=ee.useState(new Set),[p,g]=ee.useState(!1),[w,_]=ee.useState(0.9),[D,d]=ee.useState(null),s=ee.useRef(null),f=ee.useRef(0),h=ee.useMemo(()=>{return Ze.filter((k)=>{if(!(r==="全部"||k.theme===r))return!1;if(!e.trim())return!0;let H=e.toLowerCase();return k.jp.includes(e)||k.romaji.toLowerCase().includes(H)||k.zh.includes(e)||k.zh_explain.includes(e)||k.source.includes(e)})},[e,r]),x=m.size,E=()=>{window.speechSynthesis.cancel(),c(null),g(!1)},N=(k,W,H)=>{window.speechSynthesis.cancel();let ce=new SpeechSynthesisUtterance(k);ce.lang="ja-JP",ce.rate=w,ce.pitch=1;let no=window.speechSynthesis.getVoices().find((dn)=>dn.lang.includes("ja")||dn.name.includes("Japanese"));if(no)ce.voice=no;ce.onstart=()=>c(W),ce.onend=()=>{if(c(null),H)H();y((dn)=>{let uo=new Set(dn);return uo.add(W),uo})},ce.onerror=()=>c(null),s.current=ce,window.speechSynthesis.speak(ce)},C=(k)=>{if(a===k.id){E();return}N(k.jp,k.id)},V=()=>{if(p){E();return}let k=h.length?h:Ze,W=0;g(!0),f.current=0;let H=()=>{if(W>=k.length){g(!1),c(null);return}let ce=k[W];f.current=W,W++,N(ce.jp,ce.id,H)};H()};ee.useEffect(()=>{window.speechSynt
