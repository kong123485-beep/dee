의 회중에 들지 못하리로다"},{n:6,zh:"因為耶和華知道義人的道路；惡人的道路卻必滅亡。",en:"For the LORD knoweth the way of the righteous: but the way of the ungodly shall perish.",ja:"主は正しい者の道を知られる。しかし悪しき者の道は滅びる。",ko:"대저 의인의 길은 여호와께서 인정하시나 악인의 길은 망하리로다"}],"psalm-23":[{n:1,zh:"耶和華是我的牧者，我必不致缺乏。",en:"The LORD is my shepherd; I shall not want.",ja:"主はわたしの牧者であって、わたしには乏しいことがない。",ko:"여호와는 나의 목자시니 내가 부족함이 없으리로다"},{n:2,zh:"他使我躺臥在青草地上，領我在可安歇的水邊。",en:"He maketh me to lie down in green pastures: he leadeth me beside the still waters.",ja:"主はわたしを緑の牧場に伏させ、いこいのみぎわに伴われる。",ko:"그가 나를 푸른 초장에 누이시며 쉴 만한 물가으로 인도하시는도다"},{n:3,zh:"他使我的靈魂甦醒，為自己的名引導我走義路。",en:"He restoreth my soul: he leadeth me in the paths of righteousness for his name's sake.",ja:"主はわたしの魂をいきかえらせ、み名のためにわたしを正しい道に導かれる。",ko:"내 영혼을 소생시키시고 자기 이름을 위하여 의의 길로 인도하시는도다"},{n:4,zh:"我雖然行過死蔭的幽谷，也不怕遭害，因為你與我同在；你的杖，你的竿，都安慰我。",en:"Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me.",ja:"たといわたしは死の陰の谷を歩むとも、わざわいを恐れない。あなたがわたしと共におられるからである。",ko:"내가 사망의 음침한 골짜기로 다닐지라도 해를 두려워하지 않을 것은 주께서 나와 함께 하심이라"},{n:5,zh:"在我敵人面前，你為我擺設筵席；你用油膏了我的頭，使我的福杯滿溢。",en:"Thou preparest a table before me in the presence of mine enemies: thou anointest my head with oil; my cup runneth over.",ja:"あなたはわたしの敵の前で、わたしの前に宴を設け、わたしのこうべに油をそそがれる。わたしの杯はあふれる。",ko:"주께서 내 원수의 목전에서 내게 상을 베푸시고 기름으로 내 머리에 바르셨으니 내 잔이 넘치나이다"},{n:6,zh:"我一生一世必有恩惠慈愛隨著我；我且要住在耶和華的殿中，直到永遠。",en:"Surely goodness and mercy shall follow me all the days of my life: and I will dwell in the house of the LORD for ever.",ja:"わたしの生きているかぎりは必ず恵みと慈しみとが伴うであろう。わたしはとこしえに主の宮に住むであろう。",ko:"나의 평생에 선하심과 인자하심이 정녕 나를 따르리니 내가 여호와의 집에 영원히 거하리로다"}],"psalm-27":[{n:1,zh:"耶和華是我的亮光，是我的拯救，我還怕誰呢？耶和華是我性命的保障，我還懼誰呢？",en:"The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?",ja:"主はわたしの光、わたしの救い、わたしは誰を恐れよう。主はわたしのいのちの砦、誰をおそれよう。",ko:"여호와는 나의 빛이요 나의 구원이시니 내가 누구를 두려워하리요"},{n:2,zh:"那作惡的，就是我的仇敵，前來吃我肉的時候就絆跌仆倒。",en:"When the wicked, even mine enemies and my foes, came upon me to eat up my flesh, they stumbled and fell.",ja:"わたしを苦しめる者、敵がわたしに迫り肉を食らおうとした時、彼らがつまずき倒れた。",ko:"악인들이 내 살을 먹으려고 내게로 왔을 때에 넘어지고 쓰러졌도다"},{n:3,zh:"雖有軍兵安營攻擊我，我的心也不害怕；雖然興起刀兵攻擊我，我必仍舊安穩。",en:"Though an host should encamp against me, my heart shall not fear: though war should rise against me, in this will I be confident.",ja:"たとい軍勢がわたしに対して陣を張っても、わたしの心は恐れない。",ko:"군대가 나를 대적하여 진 칠지라도 내 마음이 두렵지 아니하며"},{n:4,zh:"有一件事，我曾求耶和華，我仍要尋求：就是一生一世住在耶和華的殿中，瞻仰他的榮美，在他的殿裡求問。",en:"One thing have I desired of the LORD, that will I seek after; that I may dwell in the house of the LORD all the days of my life, to behold the beauty of the LORD, and to enquire in his temple.",ja:"わたしは一つのことを主に願った、わたしはそれを求める。命ある限り主の家に住み、その麗しさを仰ぎ見ることを。",ko:"내가 여호와께 바라는 한 가지 일 그것을 구하리니 곧 평생에 여호와의 집에 살면서"},{n:5,zh:"因為我遭遇患難，他必暗暗地保守我；在他亭子裡，把我藏在他帳幕的隱密處，將我高舉在磐石上。",en:"For in the time of trouble he shall hide me in his pavilion: in the secret of his tabernacle shall he hide me; he shall set me up upon a rock.",ja:"主は悩みの日にその仮庵にわたしを隠し、その幕屋の奥にわたしをかくまい、岩の上に高く上げられる。",ko:"여호와께서 환난 날에 나를 그 초막 속에 비밀히 지키시고"}],"psalm-91":[{n:1,zh:"住在至高者隱密處的，必住在全能者的蔭下。",en:"He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty.",ja:"いと高き者のもとに住む者は全能者の陰に宿る。",ko:"지존자의 은밀한 곳에 거하는 자는 전능하신 자의 그늘 아래 거하리로다"},{n:2,zh:"我要論到耶和華說：他是我的避難所，是我的山寨，是我的神，是我所倚靠的。",en:"I will say of the LORD, He is my refuge and my fortress: my God; in him will I trust.",ja:"わたしは主に言う、あなたはわが避け所、わが城、わが信頼する神であると。",ko:"내가 여호와를 가리켜 말하기를 저는 나의 피난처요 나의 요새라"},{n:3,zh:"他必救你脫離捕鳥人的網羅和毒害的瘟疫。",en:"Surely he shall deliver thee from the snare of the fowler, and from the noisome pestilence.",ja:"主はあなたを狩人のわなと恐ろしい疫病から救われる。",ko:"그가 너를 새 사냥꾼의 올무에서와 극한 염병에서 건지실 것임이로다"},{n:4,zh:"他必用自己的翎毛遮蔽你；你要投靠在他的翅膀底下；他的誠實是大小的盾牌。",en:"He shall cover thee with his feathers, and under his wings shalt thou trust: his truth shall be thy shield and buckler.",ja:"主はその羽をもってあなたをおおい、その翼の下に避け所を与えられる。",ko:"그가 깃으로 너를 덮으시리니 네가 그 날개 아래 피하리로다"},{n:5,zh:"你必不怕黑夜的驚駭，或是白日飛的箭，",en:"Thou shalt not be afraid for the terror by night; nor for the arrow that flieth by day;",ja:"あなたは夜の恐ろしい物をも昼飛ぶ矢をも恐れることはない。",ko:"너는 밤에 놀램과 낮에 흐르는 화살과"}],"psalm-121":[{n:1,zh:"我要向山舉目；我的幫助從何而來？",en:"I will lift up mine eyes unto the hills, from whence cometh my help.",ja:"わたしは山にむかって目をあげる。わが助けはどこから来るか。",ko:"내가 산을 향하여 눈을 들리라 나의 도움이 어디서 올꼬"},{n:2,zh:"我的幫助從造天地的耶和華而來。",en:"My help cometh from the LORD, which made heaven and earth.",ja:"わが助けは天と地を造られた主から来る。",ko:"나의 도움은 천지를 지으신 여호와에게서로다"},{n:3,zh:"他必不叫你的腳搖動；保護你的必不打盹！",en:"He will not suffer thy foot to be moved: he that keepeth thee will not slumber.",ja:"主はあなたの足の動くのを許されない。あなたを守る者はまどろむことがない。",ko:"여호와께서 너로 실족지 않게 하시며 너를 지키시는 자가 졸지 아니하시리로다"},{n:4,zh:"保護以色列的，也不打盹也不睡覺。",en:"Behold, he that keepeth Israel shall neither slumber nor sleep.",ja:"見よ、イスラエルを守る者はまどろむこともなく、眠ることもない。",ko:"이스라엘을 지키시는 자는 졸지도 아니하시고 주무시지도 아니하시리로다"},{n:5,zh:"保護你的是耶和華；耶和華在你右邊蔭庇你。",en:"The LORD is thy keeper: the LORD is thy shade upon thy right hand.",ja:"主はあなたを守る者、主はあなたの右の手をおおう陰である。",ko:"여호와는 너를 지키시는 자라 여호와께서 네 우편에서 네 그늘이 되시나니"},{n:6,zh:"白日，太陽必不傷你；夜間，月亮必不害你。",en:"The sun shall not smite thee by day, nor the moon by night.",ja:"昼は太陽があなたを撃つことなく、夜は月があなたを撃つことはない。",ko:"낮의 해가 너를 상치 아니하며 밤의 달도 너를 해치 아니하리로다"},{n:7,zh:"耶和華要保護你，免受一切的災害；他要保護你的性命。",en:"The LORD shall preserve thee from all evil: he shall preserve thy soul.",ja:"主はあなたをすべての災いから守り、あなたの命を守られる。",ko:"여호와께서 너를 지켜 모든 환난을 면케 하시며 또 네 영혼을 지키시리로다"},{n:8,zh:"你出你入，耶和華要保護你，從今時直到永遠。",en:"The LORD shall preserve thy going out and thy coming in from this time forth, and even for evermore.",ja:"主はあなたの出ると入るとを今よりとこしえまでも守られるであろう。",ko:"여호와께서 너의 출입을 지금부터 영원까지 지키시리로다"}],"proverb-1":[{n:1,zh:"以色列王大衛兒子所羅門的箴言：",en:"The proverbs of Solomon the son of David, king of Israel;",ja:"ダビデの子、イスラエルの王ソロモンの箴言。",ko:"다윗의 아들 이스라엘 왕 솔로몬의 잠언이라"},{n:2,zh:"要使人曉得智慧和訓誨，分辨通達的言語，",en:"To know wisdom and instruction; to perceive the words of understanding;",ja:"これは知恵と教訓とを知り、悟りの言葉を理解し、",ko:"이는 지혜와 훈계를 알게 하며 명철의 말씀을 깨닫게 하며"},{n:3,zh:"使人處事領受智慧、仁義、公平、
