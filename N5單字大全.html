<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT N5 日語單字大師</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-emerald-600 p-2.5 rounded-xl shadow-sm font-black text-xl flex items-center justify-center">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">JLPT N5 真實日語單字大全</h1>
                    <p class="text-xs text-emerald-200">內建標準日語發音・單字卡・測驗練習</p>
                </div>
            </div>
            <div class="text-xs bg-emerald-700 px-3 py-1.5 rounded-xl border border-emerald-500/40">
                總單字數: <span id="total-count" class="font-bold text-white">718</span> 筆
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center overflow-x-auto">
            <div class="flex space-x-1 py-2">
                <button onclick="switchMode('list')" id="nav-list" class="mode-btn px-4 py-2 rounded-lg text-sm font-medium bg-emerald-50 text-emerald-600 flex items-center space-x-2 transition">
                    <i class="fa-solid fa-list"></i><span>單字列表</span>
                </button>
                <button onclick="switchMode('flashcard')" id="nav-flashcard" class="mode-btn px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 flex items-center space-x-2 transition">
                    <i class="fa-solid fa-clone"></i><span>單字卡模式</span>
                </button>
                <button onclick="switchMode('quiz')" id="nav-quiz" class="mode-btn px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 flex items-center space-x-2 transition">
                    <i class="fa-solid fa-circle-question"></i><span>測驗挑戰</span>
                </button>
                <button onclick="switchMode('bookmarks')" id="nav-bookmarks" class="mode-btn px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 flex items-center space-x-2 transition">
                    <i class="fa-solid fa-bookmark"></i><span>收藏夾 (<span id="bookmark-count">0</span>)</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- 1. LIST VIEW -->
        <section id="view-list" class="space-y-6">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 items-center justify-between">
                <div class="relative w-full md:w-96">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="search-input" oninput="handleSearch()" placeholder="搜尋日文漢字、假名或意思..." 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                </div>
                <div class="text-xs text-slate-500">
                    篩選結果: <strong id="filtered-count" class="text-emerald-600">0</strong> 筆
                </div>
            </div>

            <div id="vocab-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

            <div id="pagination-container" class="flex justify-center items-center space-x-2 pt-4"></div>
        </section>

        <!-- 2. FLASHCARD VIEW -->
        <section id="view-flashcard" class="hidden flex flex-col items-center justify-center space-y-6 py-8">
            <div class="text-center space-y-1">
                <h2 class="text-xl font-bold text-slate-800">單字卡背誦模式</h2>
                <p class="text-sm text-slate-500">點擊卡片翻面看意思，點擊發音聆聽日語讀音</p>
            </div>

            <div class="w-full max-w-md h-72 perspective-1000 cursor-pointer" onclick="flipCard()">
                <div id="flashcard-inner" class="relative w-full h-full duration-500 transform-style-3d shadow-xl rounded-2xl bg-white border border-slate-200">
                    <!-- Front -->
                    <div class="absolute inset-0 w-full h-full backface-hidden flex flex-col items-center justify-center p-6 text-center space-y-4">
                        <span class="px-3 py-1 bg-emerald-50 text-emerald-600 text-xs font-bold rounded-full">JLPT N5</span>
                        <div id="fc-expression" class="text-4xl font-extrabold text-slate-800">--</div>
                        <div id="fc-reading" class="text-xl font-medium text-emerald-500">--</div>
                        <div class="text-xs text-slate-400 pt-2"><i class="fa-solid fa-rotate"></i> 點擊翻轉看意思</div>
                    </div>
                    <!-- Back -->
                    <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 flex flex-col items-center justify-center p-6 text-center space-y-4 bg-emerald-900 text-white rounded-2xl">
                        <span class="text-xs text-emerald-300 font-semibold">中文/英文意思</span>
                        <div id="fc-meaning" class="text-2xl font-bold">--</div>
                        <div class="text-xs text-emerald-300 pt-2"><i class="fa-solid fa-rotate"></i> 點擊翻回正面</div>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <button onclick="prevFlashcard()" class="px-5 py-2.5 bg-white border border-slate-200 shadow-sm rounded-xl text-sm font-semibold hover:bg-slate-50 transition flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> 上一個
                </button>
                <button onclick="speakCurrentFlashcard()" class="px-5 py-2.5 bg-emerald-600 text-white shadow-sm rounded-xl text-sm font-semibold hover:bg-emerald-700 transition flex items-center gap-2">
                    <i class="fa-solid fa-volume-high"></i> 🔊 朗讀發音
                </button>
                <button onclick="nextFlashcard()" class="px-5 py-2.5 bg-white border border-slate-200 shadow-sm rounded-xl text-sm font-semibold hover:bg-slate-50 transition flex items-center gap-2">
                    下一個 <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
            <div class="text-sm font-medium text-slate-500">
                進度: <span id="fc-current-index" class="text-emerald-600 font-bold">1</span> / <span id="fc-total">1</span>
            </div>
        </section>

        <!-- 3. QUIZ VIEW -->
        <section id="view-quiz" class="hidden max-w-2xl mx-auto space-y-6 py-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">N5 單字能力小測驗</h2>
                        <p class="text-xs text-slate-500">測試您對單字意思的理解</p>
                    </div>
                    <button onclick="startQuiz()" class="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl hover:bg-emerald-700 transition">
                        重新開始測驗
                    </button>
                </div>

                <div id="quiz-question-container" class="space-y-4">
                    <div class="flex justify-between text-xs text-slate-400 font-medium">
                        <span>題目 <span id="quiz-q-num">1</span> / 10</span>
                        <span>得分: <span id="quiz-score" class="text-emerald-600 font-bold">0</span></span>
                    </div>
                    <div class="bg-emerald-50/50 p-6 rounded-2xl border border-emerald-100 text-center space-y-2">
                        <div class="inline-block px-2.5 py-0.5 bg-emerald-600 text-white text-xs font-bold rounded-full">JLPT N5</div>
                        <div id="quiz-word" class="text-4xl font-black text-emerald-950">--</div>
                        <div id="quiz-reading" class="text-sm text-emerald-600 font-medium">--</div>
                    </div>
                    <div id="quiz-options" class="grid grid-cols-1 gap-3 pt-2"></div>
                </div>

                <div id="quiz-result-container" class="hidden text-center space-y-4 py-6">
                    <div class="text-5xl font-black text-emerald-600" id="final-score-text">0 / 10</div>
                    <h3 class="text-xl font-bold text-slate-800">測驗完成！</h3>
                    <button onclick="startQuiz()" class="px-6 py-2.5 bg-emerald-600 text-white text-sm font-bold rounded-xl hover:bg-emerald-700 transition shadow-md">
                        再次挑戰
                    </button>
                </div>
            </div>
        </section>

        <!-- 4. BOOKMARKS VIEW -->
        <section id="view-bookmarks" class="hidden space-y-6">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-bookmark text-amber-500"></i> 我的收藏單字</h2>
                <span class="text-xs text-slate-500">已收藏: <strong id="bm-count" class="text-emerald-600">0</strong> 筆</span>
            </div>
            <div id="bookmarks-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>

    </main>

            { expression: "南", reading: "みなみ", meaning: "south" },
            { expression: "耳", reading: "みみ", meaning: "ear" },
            { expression: "見る", reading: "みる", meaning: "to see" },
            { expression: "みんな", reading: "みんな", meaning: "all" },
            { expression: "向こう", reading: "むこう", meaning: "beyond" },
            { expression: "難しい", reading: "むずかしい", meaning: "difficult" },
            { expression: "六日", reading: "むいか", meaning: "sixth day" },

            { expression: "村", reading: "むら", meaning: "village" },

            { expression: "眼鏡", reading: "めがね", meaning: "glasses" },

            { expression: "木曜日", reading: "もくようび", meaning: "Thursday" },
            { expression: "持つ", reading: "もつ", meaning: "to hold" },
            { expression: "物", reading: "もの", meaning: "thing" },
            { expression: "門", reading: "もん", meaning: "gate" },
            { expression: "問題", reading: "もんだい", meaning: "problem" },
            { expression: "野菜", reading: "やさい", meaning: "vegetable" },
            { expression: "易しい", reading: "やさしい", meaning: "easy" },
            { expression: "安い", reading: "やすい", meaning: "cheap" },
            { expression: "休み", reading: "やすみ", meaning: "holiday" },
            { expression: "休む", reading: "やすむ", meaning: "to rest" },
            { expression: "八日", reading: "ようか", meaning: "eighth day" },
            { expression: "洋服", reading: "ようふく", meaning: "Western clothes" },
            { expression: "横", reading: "よこ", meaning: "beside" },
            { expression: "よく", reading: "よく", meaning: "often" },
            { expression: "四日", reading: "よっか", meaning: "fourth day" },
            { expression: "四つ", reading: "よっつ", meaning: "four" },
            { expression: "呼ぶ", reading: "よぶ", meaning: "to call" },
            { expression: "読む", reading: "よむ", meaning: "to read" },
            { expression: "夜", reading: "よる", meaning: "night" },
            { expression: "来週", reading: "らいしゅう", meaning: "next week" },
            { expression: "来月", reading: "らいげつ", meaning: "next month" },
            { expression: "来年", reading: "らいねん", meaning: "next year" },
            { expression: "ラジオ", reading: "ラジオ", meaning: "radio" },
            { expression: "留学生", reading: "りゅうがくせい", meaning: "exchange student" },
            { expression: "両親", reading: "りょうしん", meaning: "parents" },
            { expression: "料理", reading: "りょうり", meaning: "cooking" },
            { expression: "旅行", reading: "りょこう", meaning: "travel" },
            { expression: "零", reading: "れい", meaning: "zero" },
            { expression: "冷蔵庫", reading: "れいぞうこ", meaning: "refrigerator" },
            { expression: "レストラン", reading: "レストラン", meaning: "restaurant" },
            { expression: "練習", reading: "れんしゅう", meaning: "practice" },
            { expression: "廊下", reading: "ろうか", meaning: "corridor" },
            { expression: "六", reading: "ろく", meaning: "six" },
            { expression: "ワイシャツ", reading: "ワイシャツ", meaning: "white shirt" },
            { expression: "若い", reading: "わかい", meaning: "young" },
            { expression: "分かる", reading: "わかる", meaning: "to understand" },
            { expression: "忘れる", reading: "わすれる", meaning: "to forget" },
            { expression: "私", reading: "わたし", meaning: "I" },
            { expression: "渡す", reading: "わたす", meaning: "to hand over" },
            { expression: "渡る", reading: "わたる", meaning: "to cross" },
            { expression: "悪い", reading: "わるい", meaning: "bad" }
        ];

        let currentMode = 'list';
        let searchQuery = '';
        let bookmarks = JSON.parse(localStorage.getItem('jlpt_n5_bookmarks') || '[]');
        
        let fcIndex = 0;
        let isFlipped = false;

        let quizList = [];
        let quizIndex = 0;
        let quizScore = 0;

        let currentPage = 1;
        const itemsPerPage = 21;

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('total-count').innerText = rawData.length;
            updateBookmarkCount();
            renderList();
        });

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = "mode-btn px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 flex items-center space-x-2 transition";
            });
            document.getElementById(`nav-${mode}`).className = "mode-btn px-4 py-2 rounded-lg text-sm font-medium bg-emerald-50 text-emerald-600 flex items-center space-x-2 transition";

            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-flashcard').classList.add('hidden');
            document.getElementById('view-quiz').classList.add('hidden');
            document.getElementById('view-bookmarks').classList.add('hidden');

            if (mode === 'list') {
                document.getElementById('view-list').classList.remove('hidden');
                renderList();
            } else if (mode === 'flashcard') {
                document.getElementById('view-flashcard').classList.remove('hidden');
                initFlashcards();
            } else if (mode === 'quiz') {
                document.getElementById('view-quiz').classList.remove('hidden');
                startQuiz();
            } else if (mode === 'bookmarks') {
                document.getElementById('view-bookmarks').classList.remove('hidden');
                renderBookmarks();
            }
        }

        function getFilteredData() {
            const query = searchQuery.toLowerCase();
            return rawData.filter(item => {
                return !query || 
                    item.expression.toLowerCase().includes(query) || 
                    item.reading.toLowerCase().includes(query) || 
                    item.meaning.toLowerCase().includes(query);
            });
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value;
            currentPage = 1;
            renderList();
        }

        function renderList() {
            const data = getFilteredData();
            document.getElementById('filtered-count').innerText = data.length;
            
            const start = (currentPage - 1) * itemsPerPage;
            const pageItems = data.slice(start, start + itemsPerPage);
            const grid = document.getElementById('vocab-grid');
            grid.innerHTML = '';

            if (pageItems.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">找不到符合的單字</div>`;
                document.getElementById('pagination-container').innerHTML = '';
                return;
            }

            pageItems.forEach(item => {
                const isBookmarked = bookmarks.some(b => b.expression === item.expression);
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between space-y-3 hover:shadow-md transition";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="px-2.5 py-0.5 bg-emerald-50 text-emerald-600 text-xs font-bold rounded-full">N5</span>
                        <div class="flex items-center space-x-2">
                            <button onclick="toggleBookmark('${item.expression}')" class="text-slate-300 hover:text-amber-500 transition ${isBookmarked ? 'text-amber-500' : ''}">
                                <i class="fa-solid fa-bookmark"></i>
                            </button>
                            <button onclick="speak('${item.expression}')" class="text-emerald-600 hover:text-emerald-800 transition p-1.5 bg-emerald-50 rounded-lg flex items-center gap-1 text-xs font-bold">
                                <i class="fa-solid fa-volume-high"></i> 讀音
                            </button>
                        </div>
                    </div>
                    <div>
                        <div class="text-2xl font-extrabold text-slate-800">${item.expression}</div>
                        <div class="text-sm font-semibold text-emerald-600">${item.reading}</div>
                    </div>
                    <div class="text-sm text-slate-600 border-t border-slate-100 pt-2">${item.meaning}</div>
                `;
                grid.appendChild(card);
            });

            renderPagination(data.length);
        }

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const container = document.getElementById('pagination-container');
            container.innerHTML = '';
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    const btn = document.createElement('button');
                    btn.className = `px-3.5 py-1.5 rounded-xl text-xs font-bold transition ${i === currentPage ? 'bg-emerald-600 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`;
                    btn.innerText = i;
                    btn.onclick = () => { currentPage = i; renderList(); window.scrollTo({top:0, behavior:'smooth'}); };
                    container.appendChild(btn);
                }
            }
        }

        // Web Speech API 朗讀日語
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('您的瀏覽器不支援語音朗讀功能');
            }
        }

        // Flashcards
        function initFlashcards() {
            fcIndex = 0;
            isFlipped = false;
            document.getElementById('fc-total').innerText = rawData.length;
            updateFlashcardUI();
        }

        function updateFlashcardUI() {
            const item = rawData[fcIndex];
            document.getElementById('fc-expression').innerText = item.expression;
            document.getElementById('fc-reading').innerText = item.reading;
            document.getElementById('fc-meaning').innerText = item.meaning;
            document.getElementById('fc-current-index').innerText = fcIndex + 1;
            
            if (isFlipped) {
                document.getElementById('flashcard-inner').classList.remove('rotate-y-180');
                isFlipped = false;
            }
        }

        function flipCard() {
            const inner = document.getElementById('flashcard-inner');
            if (isFlipped) {
                inner.classList.remove('rotate-y-180');
                isFlipped = false;
            } else {
                inner.classList.add('rotate-y-180');
                isFlipped = true;
            }
        }

        function nextFlashcard() {
            fcIndex = (fcIndex + 1) % rawData.length;
            updateFlashcardUI();
        }

        function prevFlashcard() {
            fcIndex = (fcIndex - 1 + rawData.length) % rawData.length;
            updateFlashcardUI();
        }

        function speakCurrentFlashcard() {
            speak(rawData[fcIndex].expression);
        }

        // Quiz
        function startQuiz() {
            quizList = [...rawData].sort(() => 0.5 - Math.random()).slice(0, 10);
            quizIndex = 0;
            quizScore = 0;
            document.getElementById('quiz-question-container').classList.remove('hidden');
            document.getElementById('quiz-result-container').classList.add('hidden');
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            if (quizIndex >= quizList.length) {
                showQuizResults();
                return;
            }
            const currentQ = quizList[quizIndex];
            document.getElementById('quiz-q-num').innerText = quizIndex + 1;
            document.getElementById('quiz-score').innerText = quizScore;
            document.getElementById('quiz-word').innerText = currentQ.expression;
            document.getElementById('quiz-reading').innerText = currentQ.reading;

            const pool = rawData.filter(item => item.meaning !== currentQ.meaning);
            const distractors = [...pool].sort(() => 0.5 - Math.random()).slice(0, 3);
            const options = [...distractors, currentQ].sort(() => 0.5 - Math.random());

            const container = document.getElementById('quiz-options');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full p-3.5 bg-slate-50 hover:bg-emerald-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 transition text-left";
                btn.innerText = opt.meaning;
                btn.onclick = () => checkAnswer(opt.meaning === currentQ.meaning, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect, btnElement) {
            const buttons = document.getElementById('quiz-options').querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);

            if (isCorrect) {
                quizScore++;
                btnElement.className = "w-full p-3.5 bg-emerald-100 border border-emerald-300 rounded-xl text-sm font-semibold text-emerald-800 transition text-left";
            } else {
                btnElement.className = "w-full p-3.5 bg-rose-100 border border-rose-300 rounded-xl text-sm font-semibold text-rose-800 transition text-left";
            }

            setTimeout(() => {
                quizIndex++;
                loadQuizQuestion();
            }, 1000);
        }

        function showQuizResults() {
            document.getElementById('quiz-question-container').classList.add('hidden');
            document.getElementById('quiz-result-container').classList.remove('hidden');
            document.getElementById('final-score-text').innerText = `${quizScore} / ${quizList.length}`;
        }

        // Bookmarks
        function toggleBookmark(expression) {
            const index = bookmarks.findIndex(b => b.expression === expression);
            if (index > -1) {
                bookmarks.splice(index, 1);
            } else {
                const item = rawData.find(b => b.expression === expression);
                if (item) bookmarks.push(item);
            }
            localStorage.setItem('jlpt_n5_bookmarks', JSON.stringify(bookmarks));
            updateBookmarkCount();
            if (currentMode === 'list') renderList();
            if (currentMode === 'bookmarks') renderBookmarks();
        }

        function updateBookmarkCount() {
            document.getElementById('bookmark-count').innerText = bookmarks.length;
            document.getElementById('bm-count').innerText = bookmarks.length;
        }

        function renderBookmarks() {
            const grid = document.getElementById('bookmarks-grid');
            grid.innerHTML = '';
            if (bookmarks.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">目前沒有收藏任何單字</div>`;
                return;
            }
            bookmarks.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between space-y-3";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="px-2.5 py-0.5 bg-amber-50 text-amber-600 text-xs font-bold rounded-full">N5 收藏</span>
                        <div class="flex items-center space-x-2">
                            <button onclick="toggleBookmark('${item.expression}')" class="text-amber-500 hover:text-slate-300 transition">
                                <i class="fa-solid fa-bookmark"></i>
                            </button>
                            <button onclick="speak('${item.expression}')" class="text-emerald-600 hover:text-emerald-800 transition p-1.5 bg-emerald-50 rounded-lg text-xs font-bold flex items-center gap-1">
                                <i class="fa-solid fa-volume-high"></i> 讀音
                            </button>
                        </div>
                    </div>
                    <div>
                        <div class="text-2xl font-extrabold text-slate-800">${item.expression}</div>
                        <div class="text-sm font-semibold text-emerald-600">${item.reading}</div>
                    </div>
                    <div class="text-sm text-slate-600 border-t border-slate-100 pt-2">${item.meaning}</div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
